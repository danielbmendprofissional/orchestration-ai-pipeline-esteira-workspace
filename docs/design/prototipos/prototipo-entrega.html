<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteira — Entrega (protótipo D1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
[hidden]{display:none!important}
.map{grid-template-columns:136px repeat(5,minmax(112px,1fr));min-width:800px}
.map.um{grid-template-rows:156px}
.map.um .st.span{grid-row:1/span 1}
.track.api{background:linear-gradient(90deg,var(--blue2) 0 var(--p,0%),transparent var(--p,0%)),repeating-linear-gradient(90deg,var(--ln2) 0 7px,transparent 7px 13px)}
.track.front{background:linear-gradient(90deg,var(--front) 0 var(--p,0%),transparent var(--p,0%)),repeating-linear-gradient(90deg,var(--ln2) 0 7px,transparent 7px 13px)}
.st{cursor:pointer}
.cod{font-family:var(--mono);font-size:12.5px;color:var(--tx2);margin-right:8px}
.tt{font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);border:1px solid var(--ln2);border-radius:6px;padding:1px 7px;margin-left:8px;white-space:nowrap}
.tag .i{width:12px;height:12px}
.linkr{display:inline-flex;align-items:center;gap:6px;color:var(--blue-tx);font-size:12.5px}
.linkr:hover{text-decoration:underline}
.proj{display:inline-flex;gap:6px}
.faixas{display:grid;gap:10px;margin-bottom:18px}.faixas .faixa{margin:0}
.fs{display:grid;gap:6px;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:13px}
.fs:last-child{border-bottom:0}
.fs .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fs .l1 input{width:16px;height:16px;accent-color:var(--blue2)}
.fs .l1 label{display:flex;align-items:center;gap:10px;cursor:pointer}
.fs .links{display:flex;gap:6px 16px;flex-wrap:wrap;padding-left:26px}
.fs .dir2{margin-left:auto;color:var(--mu);font-size:12.5px}
.ordem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--tx2);font-size:13px}
.ordem .i{color:var(--mu)}
.conf{border:1px solid var(--ln);border-radius:10px;background:var(--s1);margin-top:12px;overflow:hidden}
.conf summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:13px;color:var(--tx2);list-style:none}
.conf summary::-webkit-details-marker{display:none}
.conf summary .i{color:var(--run-tx)}
.conf summary .chev{margin-left:auto;color:var(--mu);transition:transform .15s}
.conf[open] summary .chev{transform:rotate(90deg)}
.conf .corpo{border-top:1px solid var(--ln);padding:6px 0}
.conf .it{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--tx2)}
.conf .it .d{margin-left:auto;color:var(--mu);font-size:12.5px}
.gaveta{display:flex;flex-direction:column;padding:0}
.g-corpo{flex:1;overflow-y:auto;padding:22px 24px}
.g-pe{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--ln);background:var(--s1)}
.g-pe .esq{margin-right:auto}
.campo2{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--ln2);background:var(--s2);color:var(--tx);font:inherit}
textarea.campo2{min-height:64px}
.rotc{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.excl label{display:flex;gap:8px;align-items:flex-start;color:var(--tx2);font-size:13px;margin-bottom:8px}
.excl input[type=radio]{margin-top:3px;accent-color:var(--blue2)}
.vers{font-family:var(--mono);font-size:13px}
.aut{margin-top:12px}
</style></head>
<body data-pagina="entregas">
<nav data-menu></nav>
<main>
  <div class="crumb"><svg class="i"><use href="#i-grid"/></svg>Valuto <svg class="i"><use href="#i-chev"/></svg> Entregas <svg class="i"><use href="#i-chev"/></svg> E-12 · dados fictícios
    <label class="demo">Cenário <select data-cen></select></label>
    <label class="demo" style="margin-left:0">Ver como <select data-quem></select></label></div>
  <div class="head"><h1><span data-nome>Notificações de limite e resumo mensal</span> <span data-estado class="pill"></span></h1>
    <div class="acoes-topo"><button class="btn g"><svg class="i"><use href="#i-ext"/></svg>Abrir no GitLab</button><button class="btn d" data-cancelar><svg class="i"><use href="#i-x"/></svg>Cancelar Entrega</button></div></div>
  <div class="meta" data-meta></div>
  <div class="faixas" data-faixas></div>

  <section class="panel">
    <div class="ph"><h2><span class="ib"><svg class="i"><use href="#i-git"/></svg></span>Etapas</h2></div>
    <div class="canvas"><div class="map" data-mapa></div></div>
    <div class="legend rodape"><span><i class="sw" style="background:var(--blue2)"></i>valuto-api</span><span><i class="sw" style="background:var(--front)"></i>valuto-frontend</span>
      <span class="stat ok"><svg class="i"><use href="#i-ok"/></svg>Concluído</span><span class="stat run"><svg class="i"><use href="#i-wait"/></svg>Aguardando</span><span class="stat bad"><svg class="i"><use href="#i-fail"/></svg>Bloqueada ou falhou</span><span class="stat none"><svg class="i"><use href="#i-none"/></svg>Não iniciado ou pulada</span></div>
  </section>

  <section class="panel" id="detalhe" aria-live="polite"></section>
  <div class="barra-acao" data-acoes></div>
</main>
<div data-gaveta></div>

<script src="comum.js"></script>
<script>
const ic=(id,cls='')=>`<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const $=s=>document.querySelector(s);

/* quem vê o quê (ADR-0023, "Papéis por etapa"). Daniel abriu a Entrega: no MOR a aprovação vira autoaprovação */
const QUEM={
 mor:{nome:'Daniel',ini:'DB',rot:'MOR',pode:['tecnico','publicador','negocio']},
 tecnico:{nome:'Bruno Lima',ini:'BL',rot:'Aprovador técnico',pode:['tecnico']},
 publicador:{nome:'Carla Mendes',ini:'CM',rot:'Publicador',pode:['publicador']},
 negocio:{nome:'Elisa Prado',ini:'EP',rot:'Aprovadora de negócio',pode:['negocio']},
 membro:{nome:'Diego Rocha',ini:'DR',rot:'Membro',pode:[]}};
let quem='mor',cen='normal',sel='';
const pode=a=>QUEM[quem].pode.includes(a);

/* Entrega fictícia (as mesmas Fatias E-12 do Painel de Fatias) */
const FATIAS=[
 {c:'V9',t:'Notificações de limite',p:['API','Front'],flag:true,n:9},
 {c:'V10',t:'Resumo mensal',p:['API'],flag:true,n:10}];
const FLUXOS={api:{id:'valuto-api',stack:'.NET',prd:'3.7.0',nova:'3.8.0',tipo:'minor',sha:'9f2c41a',fatias:['V9','V10']},
              front:{id:'valuto-frontend',stack:'Angular',prd:'2.0.3',nova:'2.1.0',tipo:'minor',sha:'c4a1e07',fatias:['V9']}};
const num=c=>Number(c.replace(/\D/g,''));
const sha=c=>(num(c)*2654435+c.charCodeAt(0)*977).toString(16).padStart(7,'0').slice(0,7);
const links=f=>[['issue',`issue #${20+f.n*3}`],['git',`MR !${f.n+4} mergeada`],['code',`commit ${sha(f.c)}`]];
const ln=([i,t])=>`<a class="linkr" href="#">${ic(i==='issue'?'issue':i==='git'?'git':'code')}${t}${ic('ext')}</a>`;
const NOTAS=[['Notificações de limite','O cliente recebe um aviso quando chega a 80% do limite do cartão.'],['Resumo mensal','No primeiro dia do mês, o cliente recebe o resumo dos gastos por categoria.']];

/* estado de cada card: [classe, classe do status, ícone, texto] */
const ES={ok:['done','ok','ok','Concluído'],run:['run','run','run','Executando'],aguard:['run','run','wait','Aguardando aprovação'],bloq:['fail','bad','lock','Bloqueada'],
 falha:['fail','bad','fail','Falhou'],pulada:['void','none','arrow','Pulada'],none:['','none','none','Não iniciado'],cancel:['void','none','x','Cancelado'],
 fila:['run','run','wait','Em fila'],sup:['void','none','x','Superado'],rev:['fail','bad','fail','Revertido'],na:['void','none','none','Sem Fatias']};

/* cenários: c = estado de cada card; vez = de quem é a vez */
const CEN={
 normal:{nome:'Normal (API em QA)',est:['Aguardando aprovação · vez do Técnico','run','wait'],aqui:'aqa',c:{aber:'ok',aqa:'aguard',ahml:'none',aprd:'none',fqa:'run',fhml:'none',fprd:'none',lib:'none'},vez:{aqa:'Aprovador técnico'}},
 fila:{nome:'Em fila no HML',est:['Em fila','run','wait'],aqui:'ahml',c:{aber:'ok',aqa:'ok',ahml:'fila',aprd:'none',fqa:'ok',fhml:'none',fprd:'none',lib:'none'},
  faixa:['run','wait','valuto-api espera vaga no HML','O HML do Projeto está ocupado pela Entrega E-9 (v3.7.0). Esta Entrega entra assim que ela sair. O QA não tem fila: o Artefato novo supera o anterior.']},
 sup:{nome:'Superada no QA',est:['Superada','none','x'],aqui:'aqa',c:{aber:'ok',aqa:'sup',ahml:'cancel',aprd:'cancel',fqa:'cancel',fhml:'cancel',fprd:'cancel',lib:'cancel'},
  faixa:['cinza','alert','Entrega superada: um Artefato mais novo tomou o QA antes da aprovação','A Entrega E-13 abriu um Fluxo novo para valuto-api. Esta Entrega foi encerrada e as Fatias V9 e V10 voltaram para Prontas para Entrega, com a marca "vinha de uma Entrega superada". Nada foi gasto de versão.']},
 bloq:{nome:'Gate bloqueou',est:['Bloqueada','bad','lock'],aqui:'aqa',c:{aber:'ok',aqa:'bloq',ahml:'none',aprd:'none',fqa:'none',fhml:'none',fprd:'none',lib:'none'},
  faixa:['bad','lock','O gate de segurança bloqueou o QA de valuto-api','1 vulnerabilidade crítica sem Exceção (CVE-2026-40112, Npgsql). Saídas: corrigir e abrir nova Entrega, pedir uma Exceção, ou o Publicador usar o Atalho.']},
 falha:{nome:'Falha no deploy',est:['Com falha','bad','fail'],aqui:'ahml',c:{aber:'ok',aqa:'ok',ahml:'falha',aprd:'none',fqa:'ok',fhml:'none',fprd:'none',lib:'none'},
  faixa:['bad','fail','O deploy falhou no HML de valuto-api','Rollout não ficou pronto em 5 min em k3d-hml / no-2 (readiness probe falhando em /healthz). O cluster voltou à versão anterior sozinho.']},
 prd:{nome:'Aguardando o Publicador',est:['Aguardando aprovação · vez do Publicador','run','wait'],aqui:'aprd',c:{aber:'ok',aqa:'ok',ahml:'ok',aprd:'aguard',fqa:'ok',fhml:'ok',fprd:'aguard',lib:'none'},vez:{aprd:'Publicador',fprd:'Publicador'}},
 lib:{nome:'Publicada, aguardando Liberação',est:['Publicada, aguardando Liberação','run','wait'],aqui:'lib',c:{aber:'ok',aqa:'ok',ahml:'ok',aprd:'ok',fqa:'ok',fhml:'ok',fprd:'ok',lib:'aguard'},vez:{lib:'Aprovador de negócio'}},
 hotfix:{nome:'Hotfix com Atalho',est:['Aguardando aprovação · vez do Publicador','run','wait'],aqui:'aprd',um:true,c:{aber:'ok',aqa:'pulada',ahml:'pulada',aprd:'aguard',lib:'na'},vez:{aprd:'Publicador'},
  faixa:['cinza','arrow','Atalho usado: QA e HML puladas','Por ordem superior de Carla Mendes, com o motivo "falha no extrato de contas encerradas em produção". O Atalho não pula o gate de segurança sem Exceção, e faz só o Deploy.']},
 hotfix2:{nome:'Hotfix sem Atalho (QA normal)',est:['Aguardando aprovação · vez do Técnico','run','wait'],aqui:'aqa',um:true,c:{aber:'ok',aqa:'aguard',ahml:'none',aprd:'none',lib:'na'},vez:{aqa:'Aprovador técnico'},
  faixa:['cinza','alert','Hotfix sem o Atalho','O hotfix passa por QA e HML como qualquer Entrega. O Publicador ainda pode usar o Atalho, com o nome de quem ordenou e o motivo.']},
 rollback:{nome:'Produção em rollback',est:['Em rollback','bad','fail'],aqui:'aprd',c:{aber:'ok',aqa:'ok',ahml:'ok',aprd:'rev',fqa:'ok',fhml:'ok',fprd:'ok',lib:'none'},
  faixa:['bad','fail','valuto-api voltou para o Artefato anterior (3.7.0)','Pedido por Carla Mendes: "erro 500 no resumo mensal". O banco não volta. Nada novo de valuto-api entra em produção até a correção (hotfix ou Fatia nova). As Fatias V9 e V10 voltaram para Aguardando liberação, com o flag desligado.']},
 cancelada:{nome:'Entrega cancelada',est:['Cancelada','none','x'],aqui:'aber',c:{aber:'ok',aqa:'cancel',ahml:'cancel',aprd:'cancel',fqa:'cancel',fhml:'cancel',fprd:'cancel',lib:'cancel'},
  faixa:['cinza','x','Entrega cancelada por Daniel','Destino do código: absorver. O código e os flags continuam na main e passam a ser declarados na próxima Entrega.']}};
const ESTADO_PILL={ok:'ok',run:'run',bad:'bad',none:''};

/* mapa de etapas */
function mapa(){
  const C=CEN[cen],c=C.c,um=!!C.um;
  const card=(k,titulo,icone,col,row,extra='')=>{const [cl,sc,si,tx]=ES[c[k]],aqui=sel===k;
    const who=C.vez&&C.vez[k]?`vez: ${C.vez[k]}`:'';
    return `<button class="st ${cl} ${aqui?'sel':''} ${extra}" data-k="${k}" style="grid-column:${col};${row}"><span class="badge">${ic(c[k]==='ok'?'check':'x')}</span>
      ${C.aqui===k?`<span class="here">${ic('git')}você está aqui</span>`:''}<div class="t">${titulo}</div><div class="ic">${ic(icone)}</div><div class="s"><span class="stat ${sc}">${ic(si,c[k]==='run'?'spin':'')}${tx}</span>${who?`<span class="who">${who}</span>`:''}</div></button>`};
  const feitos=pre=>['aber','qa','hml','prd'].filter((x,i)=>{const k=i?pre+x:'aber';return k==='aber'?c.aber==='ok':c[k]==='ok'||c[k]==='pulada'}).length;
  const pa=Math.round(feitos('a')/4*100),pf=Math.round(feitos('f')/4*100);
  $('[data-mapa]').className='map'+(um?' um':'');
  $('[data-mapa]').innerHTML=`<div class="track api" style="--p:${pa}%"></div>${um?'':`<div class="track front" style="--p:${pf}%"></div>`}
   <div class="lname" style="grid-row:1"><span><i class="sw" style="background:var(--blue2)"></i>${FLUXOS.api.id}</span><small class="mono">${um?'hotfix · patch → v3.7.1':`${FLUXOS.api.tipo} → v${FLUXOS.api.nova} · .NET`}</small></div>
   ${um?'':`<div class="lname" style="grid-row:2"><span><i class="sw" style="background:var(--front)"></i>${FLUXOS.front.id}</span><small class="mono">${FLUXOS.front.tipo} → v${FLUXOS.front.nova} · Angular</small></div>`}
   ${card('aber','Abertura','file',2,'','span')}
   ${card('aqa','QA','flask',3,'grid-row:1')}${card('ahml','HML','monitor',4,'grid-row:1')}${card('aprd','PRD','rocket',5,'grid-row:1')}
   ${um?'':card('fqa','QA','flask',3,'grid-row:2')+card('fhml','HML','monitor',4,'grid-row:2')+card('fprd','PRD','rocket',5,'grid-row:2')}
   ${card('lib','Liberação','brief',6,'','span')}`;
  document.querySelectorAll('.st[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;pinta()});
}

/* painéis de cada etapa */
const fl=k=>k[0]==='a'?FLUXOS.api:FLUXOS.front;
const abas=(nomes,on)=>`<div class="tabs" role="tablist">${nomes.map(([k,n,i])=>`<button class="tab ${k===on?'on':''}" data-aba="${k}">${ic(i)}${n}</button>`).join('')}</div>`;
const lin=(i,r,v)=>`<div class="linha"><span class="rot">${ic(i)}${r}</span><span class="val">${v}</span></div>`;
const ok=t=>`<span class="pill ok">${ic('ok')}${t}</span>`,pl=(t,i='')=>`<span class="pill">${i?ic(i):''}${t}</span>`,runp=t=>`<span class="pill run">${ic('wait')}${t}</span>`,badp=t=>`<span class="pill bad">${ic('fail')}${t}</span>`;
const fatiasDe=f=>FATIAS.filter(x=>f.fatias.includes(x.c));

function detAber(){
  if(CEN[cen].um)return `<div class="ph"><h2><span class="ib">${ic('file')}</span>Abertura</h2><span class="pill ok">${ic('ok')}Concluída 22/11 09:12</span></div>
   <div class="cols"><div class="box"><h3>${ic('layers')}Entrega</h3><dl class="kv"><dt>Aberta por</dt><dd><span class="av sm">DB</span>Daniel</dd><dt>Tipo</dt><dd><span class="pill run">Hotfix</span></dd><dt>Projeto</dt><dd>valuto-api · patch → v3.7.1 <span class="pill">prevista</span></dd><dt>Motivo</dt><dd>falha no extrato de contas encerradas em produção</dd></dl></div>
   <div class="box"><h3>${ic('git')}Correção</h3><dl class="kv"><dt>Como foi feita</dt><dd>issue de hotfix · executada pelo agente</dd><dt>No GitLab</dt><dd style="gap:6px 16px">${ln(['issue','issue #151 · Hotfix: extrato de contas encerradas'])}${ln(['git','MR !71 · hotfix/extrato-conta-encerrada mergeada'])}${ln(['code','commit 7b3e1c2'])}</dd></dl></div></div>
   <p class="txt" style="margin-top:12px">Sem Fatias: o hotfix não tem Liberação. A Entrega só abriu depois da MR na <span class="mono">main</span>.</p>
   <details class="conf"><summary>${ic('alert')}Vão junto, com o flag desligado <span class="n">1</span>${ic('chev','chev')}</summary><div class="corpo"><div class="it"><span class="mono">V15</span><span>Filtros salvos no extrato</span><span class="d">na main, vai no Artefato sem ter passado por QA</span></div></div></details>
   <a class="link-aud" href="prototipo-auditoria.html#obj=E-12">${ic('clock')}ver na auditoria</a>`;
  const vaoJunto=[['V15','Filtros salvos no extrato']],sem=[['valuto-api !66','Ajuste de log do job de conciliação','09/11']];
  return `<div class="ph"><h2><span class="ib">${ic('file')}</span>Abertura</h2><span class="pill ok">${ic('ok')}Concluída 21/11 14:46</span></div>
   <div class="cols"><div class="box"><h3>${ic('layers')}Entrega</h3><dl class="kv"><dt>Aberta por</dt><dd><span class="av sm">DB</span>Daniel</dd><dt>Tipo</dt><dd><span class="pill blue">Normal</span></dd><dt>Aplicação</dt><dd>Valuto <span class="mono" style="color:var(--di)">grupo valuto</span></dd><dt>Fatias</dt><dd>${FATIAS.length}</dd></dl></div>
   <div class="box"><h3>${ic('box')}Fluxos</h3><dl class="kv"><dt>valuto-api</dt><dd>${FLUXOS.api.tipo} → v${FLUXOS.api.nova} <span class="pill">prevista</span></dd><dt>valuto-frontend</dt><dd>${FLUXOS.front.tipo} → v${FLUXOS.front.nova} <span class="pill">prevista</span></dd><dt>Ordem</dt><dd>API → front (do mapa)</dd></dl></div></div>
   <div class="sub">${ic('list')}Fatias da Entrega <span class="n">${FATIAS.length}</span></div>
   <div class="box">${FATIAS.map(f=>`<div class="fs"><div class="l1"><span class="cod">${f.c}</span><span class="tt">${f.t}</span><span class="proj">${f.p.map(x=>`<span class="chip">${ic(x==='API'?'server':'monitor')}${x}</span>`).join('')}</span></div><div class="links">${links(f).map(ln).join('')}</div></div>`).join('')}</div>
   <details class="conf"><summary>${ic('alert')}Vão junto, com o flag desligado <span class="n">${vaoJunto.length}</span>${ic('chev','chev')}</summary><div class="corpo">${vaoJunto.map(([c,t])=>`<div class="it"><span class="mono">${c}</span><span>${t}</span><span class="d">vai no Artefato porque a main é cumulativa</span></div>`).join('')}</div></details>
   <details class="conf"><summary>${ic('alert')}MRs mergeadas sem Fatia <span class="n">${sem.length}</span>${ic('chev','chev')}</summary><div class="corpo">${sem.map(([m,t,d])=>`<div class="it"><span class="mono">${m}</span><span>${t}</span><span class="d">mergeada em ${d} · só avisa</span></div>`).join('')}</div></details>
   <a class="link-aud" href="prototipo-auditoria.html#obj=E-12">${ic('clock')}ver na auditoria</a>`;
}
function detQaHml(k,amb){
  const f=fl(k),est=CEN[cen].c[k],aba=detQaHml.aba||'geral',qa=amb==='qa';
  const bloq=est==='bloq',falha=est==='falha';
  const corpo={
   geral:`<div class="sev"><button class="sv" style="--c:var(--bad)"><span class="top">Crítica${ic('alert')}</span><b ${bloq?'style="color:var(--bad-tx)"':''}>${bloq?1:0}</b><small>${bloq?'sem Exceção':'nenhuma'}</small></button>
      <button class="sv" style="--c:var(--run)"><span class="top">Alta${ic('alert')}</span><b style="color:var(--run-tx)">1</b><small>1 coberta por Exceção</small></button>
      <button class="sv" style="--c:#C9B458"><span class="top">Média${ic('bug')}</span><b>6</b><small>não bloqueiam</small></button>
      <button class="sv" style="--c:var(--low)"><span class="top">Baixa${ic('bug')}</span><b>3</b><small>informativas</small></button></div>
     <div class="resumo">
      ${lin('box','Artefato',`<span class="mono">sha ${f.sha}</span> ${pl('último SHA verde da main')} gerado uma vez e promovido por digest`)}
      ${lin('flask','Flags no '+amb.toUpperCase(),`${f.fatias.map(c=>`<span class="pill blue mono">Features:${c} ligado</span>`).join('')}`)}
      ${lin('bot','Agentes',qa?`${ok('qa-agent')}${ok('code-review')}${ok('security')}`:`${pl('não rodam de novo','bot')} mesmo Artefato aprovado no QA`)}
      ${lin('bug','DAST',qa?(falha||bloq?`${pl('ativo','shield')}`:ok('ativo · sem achado novo')):ok('passivo · sem achado novo'))}
      ${lin('shield-ok','Gate de segurança',bloq?badp('Bloqueou: 1 crítica sem Exceção'):ok(`Liberado · política de ${amb.toUpperCase()}: crítica e alta só passam com Exceção`))}
      ${lin('server','Deploy',falha?badp('Falhou em k3d-hml / no-2'):est==='aguard'||est==='ok'?ok(`Publicado em k3d-${amb} / valuto · 2/2 réplicas`):pl('aguardando','none'))}</div>`,
   analises:`<div class="cols"><div class="box"><h3>${ic('code')}Do Artefato <small style="color:var(--di);font-weight:400">roda uma vez</small></h3><div class="resumo" style="border:0;box-shadow:none">
        ${lin('shield','SAST (Opengrep)',ok('1 alta, coberta'))}${lin('box','SCA e imagem (Trivy)',ok('nenhuma CVE nova'))}${lin('key','Segredos (Gitleaks)',ok('nada'))}${lin('code','code-review (agente)',ok('aprovado'))}${lin('shield','security (agente)',ok('aprovado'))}</div></div>
      <div class="box"><h3>${ic('server')}Do Deploy <small style="color:var(--di);font-weight:400">por Destino</small></h3><div class="resumo" style="border:0;box-shadow:none">
        ${lin('bug','DAST '+(qa?'ativo':'passivo'),est==='bloq'?pl('barrado antes','lock'):ok('sem achado novo'))}${lin('flask','Smoke',ok('ok'))}${qa?lin('bot','qa-agent',ok('12 cenários, nenhuma falha')):''}</div></div></div>`,
   deploys:`<div class="box tw"><table><thead><tr><th>Destino</th><th>Artefato</th><th>Pipeline</th><th>Rollout</th><th>Smoke</th><th>Estado</th></tr></thead><tbody>
      <tr><td class="mono">k3d-${amb} / valuto</td><td class="mono">sha ${f.sha}</td><td class="mono">#2841</td><td>${falha?'0/2 réplicas':'2/2 réplicas'}</td><td>${falha?'—':'<span class="stat ok">'+ic('ok')+'ok</span>'}</td><td>${falha?badp('Falhou · revertido'):ok('Publicado há 12 min')}</td></tr></tbody></table></div>`}[aba];
  return `<div class="ph"><h2><span class="ib">${ic(qa?'flask':'monitor')}</span>${amb.toUpperCase()} · ${f.id} <span class="mono" style="color:var(--mu)">sha ${f.sha}</span></h2></div>
   ${abas([['geral','Visão geral','list'],['analises','Análises','bot'],['deploys','Deploys por Destino','rocket']],aba)}${corpo}`;
}
function detPrd(k){
  const f=fl(k),est=CEN[cen].c[k],um=!!CEN[cen].um,nova=um?'3.7.1':f.nova,tipo=um?'patch':f.tipo,rev=est==='rev';
  return `<div class="ph"><h2><span class="ib">${ic('rocket')}</span>PRD · ${f.id}</h2></div>
   <div class="resumo">
    ${lin('tag','Versão',`<span class="vers">v${f.prd}</span>${ic('chev')}<span class="vers">${nova}</span>${pl(tipo)}${rev?'':`<span style="color:var(--mu);font-size:12.5px">calculada agora sobre a maior versão já publicada; o Publicador pode corrigir o tipo</span>`}`)}
    ${!um&&k[0]==='a'?lin('branch','Ordem de publicação',`${pl('1 · valuto-api','server')}${ic('chev')}${pl('2 · valuto-frontend','monitor')} <span style="color:var(--mu);font-size:12.5px">o front só confirma se a API já está em produção</span>`):''}
    ${lin('flask','Flags que o Artefato carrega',um?pl('nenhum: hotfix sem Fatias'):f.fatias.map(c=>`<span class="pill mono">Features:${c} <b style="color:var(--di)">desligado em produção</b></span>`).join(''))}
    ${lin('shield-ok','Gate de produção',ok('Liberado · reanálise da imagem sem CVE nova'))}
    ${lin('server','Verificação técnica depois do deploy',est==='ok'?ok('rollout 2/2 e health ok'):rev?badp('rollout ok, resultado revertido a pedido'):pl('roda só depois de confirmar','none')+' <span style="color:var(--mu);font-size:12.5px">smoke e ZAP passivo rodam só depois da Liberação</span>')}
    ${lin('box','Backup pré-publicação',pl('pg_dump de produção antes da migration, guardando os 3 últimos','file'))}</div>`;
}
const libMarcadas=new Set(['V9','V10']);
function detLib(){
  const est=CEN[cen].c.lib,libera=est==='aguard';
  const ambos=['aprd','fprd'].every(k=>['ok'].includes(CEN[cen].c[k]));
  return `<div class="ph"><h2><span class="ib">${ic('brief')}</span>Liberação</h2></div>
   <div class="sub">${ic('file')}Notas de entrega</div>
   <div class="notas">${NOTAS.map(([a,b])=>`<div class="nota"><span class="ib verde">${ic('file')}</span><div><b>${a}</b><p>${b}</p></div></div>`).join('')}</div>
   <div class="sub">${ic('layers')}Fatias desta Entrega</div>
   <div class="box">${FATIAS.map(f=>{const dois=f.p.length>1,bloq=dois&&!ambos;
     return `<div class="fs"><div class="l1"><label><input type="checkbox" data-lib="${f.c}" ${libMarcadas.has(f.c)&&!bloq?'checked':''} ${libera&&!bloq?'':'disabled'} ${bloq?'title="Uma Fatia api + frontend só é liberada quando os dois Fluxos estão em produção"':''}><span class="cod">${f.c}</span><span class="tt">${f.t}</span></label>
       <span class="proj">${f.p.map(x=>`<span class="chip">${ic(x==='API'?'server':'monitor')}${x}</span>`).join('')}</span>${bloq?`<span class="dir2">${ic('lock')} espera os dois Fluxos em produção</span>`:''}</div>
       <div class="links">${links(f).map(ln).join('')}</div></div>`}).join('')}</div>
   <div class="sub">${ic('arrow')}Ordem da Liberação</div>
   <div class="ordem"><span class="chip">${ic('server')}1 · API</span>${ic('arrow')}<span class="chip">${ic('monitor')}2 · Front</span></div>
   <p class="txt" style="margin-top:8px">O botão <b>Liberar os dois Fluxos</b> liga a API e depois o front na mesma ação. A Esteira recusa ligar o flag de uma Fatia enquanto a Fatia de que ela depende não estiver liberada, e diz qual é. O Atalho não pula essa trava. Smoke e ZAP passivo rodam uma vez, depois, para o conjunto.</p>
   <p class="txt" style="margin-top:8px">As Fatias que você não marcar ficam <b>aguardando liberação</b>, em produção com o flag desligado, no menu do Painel de Fatias.</p>`;
}
function detSem(k){
  const est=CEN[cen].c[k];const nome={sup:'Superado',cancel:'Cancelado',pulada:'Pulada',na:'Não se aplica'}[est];
  return `<div class="ph"><h2><span class="ib">${ic('x')}</span>${nome}</h2></div><p class="txt">${est==='pulada'?'O Atalho passou por cima desta etapa. Quem ordenou: <b>Carla Mendes</b> (ordem superior). Motivo: falha no extrato de contas encerradas em produção.':est==='sup'?'Um Artefato mais novo tomou o QA antes da aprovação. Esta etapa foi encerrada sem aprovação e não gastou número de versão.':est==='na'?'O hotfix não tem Fatias, então não há Liberação.':'A Entrega foi cancelada antes desta etapa.'}</p>`;
}
function detalhe(){
  const k=sel,c=CEN[cen].c[k];let h;
  if(k==='aber')h=detAber();
  else if(k==='lib')h=c==='na'||c==='cancel'?detSem(k):detLib();
  else if(['sup','cancel','pulada','na'].includes(c))h=detSem(k);
  else if(k.endsWith('prd'))h=detPrd(k);
  else h=detQaHml(k,k.endsWith('qa')?'qa':'hml');
  $('#detalhe').innerHTML=h;
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{detQaHml.aba=b.dataset.aba;detalhe()});
  document.querySelectorAll('[data-lib]').forEach(x=>x.onclick=()=>{x.checked?libMarcadas.add(x.dataset.lib):libMarcadas.delete(x.dataset.lib)});
}

/* ações da etapa, no canto inferior direito; o motivo de um botão desativado vai no title */
function acoes(){
  const k=sel,c=CEN[cen].c[k],a=$('[data-acoes]'),aut=quem==='mor';let h='';
  const b=(cls,txt,ico,ok,porque,at='')=>`<button class="btn ${cls}" ${at} ${ok?'':`disabled title="${porque}"`}>${ic(ico)}${txt}</button>`;
  const atalho=['aqa','ahml','fqa','fhml'].includes(k)&&['aguard','bloq','fila','run'].includes(c)?b('g','Usar o Atalho','arrow',pode('publicador'),'Só o Publicador (ou o MOR) usa o Atalho','data-atalho'):'';
  if((k.endsWith('qa')||k.endsWith('hml'))&&c==='aguard')h=atalho+b('d','Reprovar','x',pode('tecnico'),'Só o Aprovador técnico ou o MOR aprovam o '+(k.endsWith('qa')?'QA':'HML'))+b('p','Aprovar '+(k.endsWith('qa')?'QA':'HML'),'check',pode('tecnico'),'Só o Aprovador técnico ou o MOR aprovam o '+(k.endsWith('qa')?'QA':'HML'));
  else if(c==='bloq')h=atalho+b('g','Pedir Exceção','shield',true,'');
  else if(c==='falha')h=b('g','Ver log','file',true,'')+b('p','Reexecutar deploy','run',true,'');
  else if(k.endsWith('prd')&&c==='aguard')h=b('p','Confirmar produção','rocket',pode('publicador'),'Só o Publicador (ou o MOR) confirma a produção');
  else if(k==='lib'&&c==='aguard')h=b('d','Excluir','trash',pode('negocio'),'Só o Aprovador de negócio ou o MOR liberam e excluem','data-excluir')+b('g','Liberar os dois Fluxos','layers',pode('negocio'),'Só o Aprovador de negócio ou o MOR liberam')+b('p','Liberar selecionadas','rocket',pode('negocio'),'Só o Aprovador de negócio ou o MOR liberam');
  else if(k.endsWith('prd')&&c==='rev')h=b('g','Ver rollback na auditoria','clock',true,'');
  a.innerHTML=h;
  const need=h&&aut&&((k.endsWith('qa')||k.endsWith('hml'))&&c==='aguard'||k.endsWith('prd')&&c==='aguard');
  if(need)a.insertAdjacentHTML('afterbegin',`<span class="pill run aut" title="Você abriu esta Entrega: a aprovação fica marcada como autoaprovação, com motivo obrigatório">${ic('alert')}autoaprovação</span>`);
  const at=$('[data-atalho]');if(at)at.onclick=()=>abreAtalho();
  const ex=$('[data-excluir]');if(ex)ex.onclick=()=>abreExcluir();
}

/* gaveta */
function fecha(){$('[data-gaveta]').innerHTML=''}
function gaveta(corpo,pe){
  $('[data-gaveta]').innerHTML=`<div class="veu" data-fecha></div><aside class="gaveta" role="dialog" aria-modal="true"><div class="g-corpo">${corpo}</div><div class="g-pe">${pe}</div></aside>`;
  document.querySelectorAll('[data-fecha]').forEach(x=>x.onclick=fecha);
}
function abreAtalho(){
  gaveta(`<div class="dh"><div><span class="pill run">${ic('arrow')}Atalho</span><h2>Pular QA e HML</h2></div><button class="x" data-fecha aria-label="Fechar">${ic('x')}</button></div>
   <p class="txt">O Atalho faz só o Deploy: ligar o flag é um segundo ato, com o mesmo registro. Ele <b>não pula o gate de segurança</b> sem Exceção e <b>não pula a trava de dependência</b> da Liberação.</p>
   <label class="rotc">Quem ordenou (obrigatório)</label><input class="campo2" placeholder="Nome de quem deu a ordem">
   <label class="rotc">Motivo (obrigatório)</label><textarea class="campo2" placeholder="ex.: falha no extrato de contas encerradas em produção"></textarea>
   <div class="box" style="margin-top:14px"><div class="resumo" style="border:0;box-shadow:none">${lin('shield','Achados bloqueantes',runp('1 crítica sem Exceção'))}</div></div>
   <label class="check" style="margin-top:12px"><input type="checkbox"> Aceitar todos os achados bloqueantes de uma vez (Exceção em lote: cada um vira Exceção individual, com prazo, nome e motivo)</label>
   <p class="txt" style="margin-top:10px">O Esteira posta o motivo e o nome na MR da Fatia.</p>`,
   `<button class="btn g esq" data-fecha>Cancelar</button><button class="btn p" data-fecha>${ic('arrow')}Pular QA e HML</button>`);
}
function abreExcluir(){
  gaveta(`<div class="dh"><div><span class="pill neutro">${ic('trash')}Excluir</span><h2>Excluir as Fatias não liberadas</h2></div><button class="x" data-fecha aria-label="Fechar">${ic('x')}</button></div>
   <div class="excl"><label><input type="radio" name="d" checked><span><b>Reverter</b> — desliga o flag em todos os ambientes e pede uma Fatia de limpeza (<span class="mono">V9-L</span>) que remove o código.</span></label>
   <label><input type="radio" name="d"><span><b>Absorver</b> — o código e o flag continuam e passam a ser declarados na próxima Entrega.</span></label></div>
   <label class="rotc">Motivo (obrigatório)</label><textarea class="campo2" placeholder="Por que excluir?"></textarea>`,
   `<button class="btn g esq" data-fecha>Cancelar</button><button class="btn d" data-fecha>Confirmar exclusão</button>`);
}

function pinta(){
  const C=CEN[cen];
  $('[data-estado]').className='pill '+ESTADO_PILL[C.est[1]];$('[data-estado]').innerHTML=`${ic(C.est[2],C.est[2]==='run'?'spin':'')}${C.est[0]}`;
  $('[data-nome]').textContent=C.um?'Hotfix: extrato de contas encerradas':'Notificações de limite e resumo mensal';
  $('[data-meta]').innerHTML=`<span class="mono">#E-12</span><span>${ic('tag')}<span class="mono">${C.um?'api v3.7.1 (hotfix)':'api v3.8.0 · front v2.1.0'} · previstas</span></span><span>${ic('list')}${C.um?'sem Fatias':'2 Fatias'}</span><span><span class="av sm">DB</span>Daniel · há 3 dias</span>`;
  $('[data-faixas]').innerHTML=C.faixa?`<div class="faixa ${C.faixa[0]}">${ic(C.faixa[1])}<div><b>${C.faixa[2]}</b><p>${C.faixa[3]}</p></div></div>`:'';
  $('[data-cancelar]').disabled=['sup','cancelada'].includes(cen);
  if(!sel||!CEN[cen].c[sel]||(C.um&&sel.startsWith('f')))sel=C.aqui;
  mapa();detalhe();acoes();
}
$('[data-cen]').innerHTML=Object.entries(CEN).map(([k,v])=>`<option value="${k}">${v.nome}</option>`).join('');
$('[data-quem]').innerHTML=Object.entries(QUEM).map(([k,q])=>`<option value="${k}">${q.nome} · ${q.rot}</option>`).join('');
$('[data-cen]').onchange=e=>{cen=e.target.value;sel=CEN[cen].aqui;detQaHml.aba='geral';pinta()};
$('[data-quem]').onchange=e=>{quem=e.target.value;$('.me').innerHTML=`<span class="av">${QUEM[quem].ini}</span><div>${QUEM[quem].nome}<small>${quem==='mor'?'MOR':'papel na Aplicação'}</small></div>`;acoes()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha()});
sel=CEN[cen].aqui;pinta();
</script>
</body></html>
