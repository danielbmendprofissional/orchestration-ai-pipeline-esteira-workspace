<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteira — Auditoria (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
[hidden]{display:none!important}
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.topo h1{margin-right:auto}
.filtrobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.campo{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--ln2);border-radius:9px;background:var(--s1);color:var(--mu);flex:0 1 280px;min-width:0}
.campo:focus-within{border-color:var(--blue2);box-shadow:0 0 0 3px #0A4EE433}
.campo input{border:0;background:none;color:var(--tx);font:inherit;outline:none;width:100%}
.sel{padding:7px 11px;border:1px solid var(--ln2);border-radius:9px;background:var(--s1);color:var(--tx2);font:inherit;max-width:100%}
.filtros{margin-bottom:14px}
.ativo{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--blue2);border-radius:999px;background:var(--blue-bg);color:#fff;font-size:13px;margin-bottom:12px}
.ativo button{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:0;background:#FFFFFF1A;color:#fff}
.ativo .i{width:12px;height:12px}
.demo{flex-wrap:wrap;justify-content:flex-end;max-width:100%}.demo select{min-width:0;max-width:100%}

/* linha do tempo */
.lista{border:1px solid var(--ln);border-radius:12px;background:var(--s1);box-shadow:inset 0 1px 0 var(--hl);overflow:hidden}
.dia{padding:8px 20px;font-size:12px;font-weight:600;color:var(--mu);background:var(--s2);border-bottom:1px solid var(--ln)}
.ev{display:grid;grid-template-columns:44px 28px minmax(0,1fr) minmax(110px,160px) 20px;gap:14px;align-items:center;width:100%;padding:12px 20px;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;color:inherit;font-size:13.5px}
.ev:last-child{border-bottom:0}.ev:hover{background:var(--s2)}
.hora{font-family:var(--mono);font-size:12.5px;color:var(--mu)}
.ci{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--s3);border:1px solid var(--ln2);color:var(--tx2)}
.ci .i{width:14px;height:14px}
.fr{line-height:1.45}.fr b{font-weight:600}
.fr .obj{font-family:var(--mono);font-size:12.5px;color:var(--tx)}
.mud{color:var(--di);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mud s{color:var(--di)}.mud .para{color:var(--tx2)}
.app{color:var(--mu);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ator-bot{display:inline-flex;align-items:center;gap:5px}
.pagl{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mu);font-size:13px}
.nums{display:flex;gap:4px}
.nums button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx2)}
.nums button.on{border-color:var(--blue2);background:var(--blue-bg);color:#fff}
.nums button:disabled{opacity:.4;cursor:not-allowed}
.obs{color:var(--mu);font-size:12.5px;margin-top:14px}.obs .i{width:14px;height:14px;margin-right:6px;vertical-align:-2px}

/* gaveta */
.gaveta .kv{margin-bottom:6px}
.acoes.dir{justify-content:flex-end;flex-wrap:wrap}
table.dif td{white-space:normal;vertical-align:top}
table.dif td.antes{color:var(--di);text-decoration:line-through}
table.dif td.depois{color:var(--tx)}
.motivo-box{border-left:2px solid var(--ln2);padding:2px 0 2px 14px;color:var(--tx2);font-size:13.5px;line-height:1.6}

@media (max-width:900px){.ev{grid-template-columns:44px 28px minmax(0,1fr);row-gap:4px}.ev .app{grid-column:3}.ev>:last-child{display:none}}
</style></head>

  <div class="lista"><div data-lista></div></div>
  <div class="pagl"><span data-pag-info></span><div class="nums" data-nums></div></div>
  <p class="obs"><svg class="i"><use href="#i-lock"/></svg>Registros não podem ser alterados nem apagados.</p>
</main>

const $=s=>document.querySelector(s);

const rotDia=s=>{const n=Math.round((HOJE-dataDe(s))/DIA);return n===0?'Hoje':n===1?'Ontem':s.split(' ')[0]};

 ['22/10/2026 18:30','Carla Mendes','tela','excecao','aprovou a exceção',['SEC-2298','Chave de API no repositório','prototipo-excecoes.html#ver=SEC-2298'],'Portal do Cliente',[['Estado','Aguardando aprovação','Ativa']]],

 ['20/10/2026 16:20','Bruno Lima','tela','politica','endureceu a política de DEV',['Cobrança Pix','Política de segurança','prototipo-aplicacoes.html#app=CPX'],'Cobrança Pix',[['Modo em DEV','avisa','bloqueia'],['Crítica (máx. sem exceção)','—','0']]],
 ['20/10/2026 11:12','pipeline #2830','pipeline','publicacao','gate de QA bloqueou',['v2.2.0-rc1','valuto-frontend · Cadastro de cartões','prototipo-entrega.html'],'Valuto',[['Resultado','—','Bloqueado: 1 crítica sem exceção']]],

 ['19/10/2026 10:30','Daniel','tela','cadastro','adicionou o projeto',['valuto-batch','Projeto','prototipo-aplicacoes.html#app=VLT'],'Valuto',[['Stack','—','outro'],['Ambientes','—','DEV, QA, PRD']]],

 ['17/10/2026 18:05','Carla Mendes','tela','aprovacao','publicou em produção',['v2.4.0','cpx-web · Pix por QR code','prototipo-entrega.html'],'Cobrança Pix',[['PRD','v2.3.2','v2.4.0']]],
 ['16/10/2026 09:40','Daniel','tela','papeis','tirou o papel Analista de Gabi Torres',['Valuto','Pessoas e papéis','prototipo-aplicacoes.html#app=VLT'],'Valuto',[['Gabi Torres','Analista, Membro','Membro']],'Mudou de time.'],
 ['15/10/2026 14:00','Diego Rocha','tela','entrega','abriu a entrega',['ENT-0039','Aditivos em lote','prototipo-entrega.html'],'Gestão de Contratos',[['Projetos','—','contratos-api v3.2.0']]],
 ['14/10/2026 10:15','Daniel','tela','cadastro','criou a aplicação',['CPX','Cobrança Pix','prototipo-aplicacoes.html#app=CPX'],'Cobrança Pix',[['Grupo do GitLab','—','cobranca-pix'],['Política','—','padrão']]]
].map(([quando,quem,orig,cat,verbo,obj,app,mud,motivo,auto],i)=>({id:'AUD-'+String(9120-i),quando,quem,orig,cat,verbo,obj,app,mud,motivo,auto}));

const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const ator=e=>e.orig==='tela'?`<b>${e.quem}</b>`:`<span class="ator-bot">${ic(e.orig==='bot'?'bot':'git')}<b>${e.quem}</b></span>`;
const resumoMud=e=>e.mud.slice(0,2).map(([c,a,d])=>`${c}: ${a==='—'?'':`<s>${a}</s> → `}<span class="para">${d}</span>`).join(' · ');

/* filtro vindo de outra tela: #obj=ENT-0042&cat=escopo · #app=Valuto&cat=politica */
let objF='',filtroCat='todas',pagina=0;
function lerHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  objF=h.get('obj')||'';filtroCat=h.get('cat')||'todas';pagina=0;
  if(h.get('app')){desenhaSelects();$('[data-app]').value=h.get('app')}
}
const visiveis=()=>EV.filter(e=>!QUEM[quem].apps||QUEM[quem].apps.includes(e.app));
function desenhaSelects(){
  const a=$('[data-app]'),q=$('[data-quem-f]'),va=a.value,vq=q.value,l=visiveis();
  a.innerHTML='<option value="">Todas as aplicações</option>'+[...new Set(l.map(e=>e.app))].sort().map(x=>`<option ${x===va?'selected':''}>${x}</option>`).join('');
  q.innerHTML='<option value="">Qualquer pessoa</option>'+[...new Set(l.filter(e=>e.orig==='tela').map(e=>e.quem))].sort().map(x=>`<option ${x===vq?'selected':''}>${x}</option>`).join('')+`<option value="@bot" ${vq==='@bot'?'selected':''}>Bot da Esteira</option><option value="@pipeline" ${vq==='@pipeline'?'selected':''}>Pipelines</option>`;
}
function crumb(){
  $('[data-crumb]').innerHTML=`${ic('clock')}Auditoria · dados fictícios
   <label class="demo">Ver como <select data-quem>${Object.entries(QUEM).map(([k,q])=>`<option value="${k}" ${k===quem?'selected':''}>${q.nome} · ${q.rot}</option>`).join('')}</select></label>`;
  $('[data-quem]').onchange=e=>{quem=e.target.value;$('.me').innerHTML=`<span class="av">${QUEM[quem].ini}</span><div>${QUEM[quem].nome}<small>${quem==='mor'?'MOR':'sem papel global'}</small></div>`;desenhaSelects();lista()};
}
function lista(){
  const app=$('[data-app]').value,qf=$('[data-quem-f]').value,per=+$('[data-periodo]').value,q=$('[data-busca]').value.toLowerCase();
  const filtra=c=>visiveis().filter(e=>(c==='todas'||e.cat===c)&&(!app||e.app===app)&&(!objF||e.obj[0]===objF)
    &&(!qf||(qf==='@bot'?e.orig==='bot':qf==='@pipeline'?e.orig==='pipeline':e.quem===qf))&&(HOJE-dataDe(e.quando))/DIA<=per
    &&(e.quem+' '+e.verbo+' '+e.obj.join(' ')+' '+e.mud.flat().join(' ')+' '+(e.motivo||'')).toLowerCase().includes(q));
  $('[data-cats]').innerHTML=`<button class="f ${filtroCat==='todas'?'on':''}" data-cat="todas">Todos <span class="n">${filtra('todas').length}</span></button>`+Object.entries(CATS).map(([k,[n]])=>`<button class="f ${filtroCat===k?'on':''}" data-cat="${k}">${n} <span class="n">${filtra(k).length}</span></button>`).join('');
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filtroCat=b.dataset.cat;pagina=0;lista()});
  $('[data-ativo]').innerHTML=objF?`<span class="ativo">Só <span class="mono">${objF}</span><button aria-label="Tirar este filtro" data-limpa>${ic('x')}</button></span>`:'';
  $('[data-limpa]')?.addEventListener('click',()=>{objF='';history.replaceState(null,'',location.pathname);lista()});
  const l=filtra(filtroCat),POR=12,paginas=Math.max(1,Math.ceil(l.length/POR));pagina=Math.min(Math.max(pagina,0),paginas-1);
  let ult='';
  $('[data-lista]').innerHTML=l.length?l.slice(pagina*POR,pagina*POR+POR).map(e=>{const d=rotDia(e.quando),cab=d!==ult?`<div class="dia">${d}</div>`:'';ult=d;
    return cab+`<button class="ev" data-id="${e.id}" title="${e.mud.map(([c,a,dd])=>`${c}: ${a} → ${dd}`).join('\n')}${e.motivo?'\nMotivo: '+e.motivo:''}">
      <span class="hora">${e.quando.split(' ')[1]}</span>
      <span class="ci" title="${CATS[e.cat][0]}">${ic(CATS[e.cat][1])}</span>
      <div style="min-width:0"><div class="fr">${ator(e)} ${e.verbo} <span class="obj">${e.obj[0]}</span>${e.auto?' <span class="pill run">autoaprovação</span>':''}</div><div class="mud">${e.obj[1]} · ${resumoMud(e)}</div></div>
      <span class="app">${e.app}</span>${ic('chev')}</button>`}).join('')
    :`<div class="empty" style="margin:18px;border:0">${ic('clock','lg')}<b style="color:var(--tx)">Nenhum registro com esses filtros</b>${QUEM[quem].apps?'<span>Você só vê as aplicações em que tem papel.</span>':''}</div>`;
  $('[data-pag-info]').textContent=l.length?`${pagina*POR+1}–${Math.min(l.length,pagina*POR+POR)} de ${l.length}`:'';
  $('[data-nums]').innerHTML=paginas>1?`<button data-p="${pagina-1}" ${pagina===0?'disabled':''} aria-label="Página anterior">‹</button>`+Array.from({length:paginas},(_,i)=>`<button data-p="${i}" class="${i===pagina?'on':''}">${i+1}</button>`).join('')+`<button data-p="${pagina+1}" ${pagina>=paginas-1?'disabled':''} aria-label="Próxima página">›</button>`:'';
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pagina=+b.dataset.p;lista()});
  document.querySelectorAll('.ev').forEach(b=>b.onclick=()=>detalhe(b.dataset.id));
}
['[data-app]','[data-quem-f]','[data-periodo]'].forEach(s=>$(s).onchange=()=>{pagina=0;lista()});
$('[data-busca]').oninput=()=>{pagina=0;lista()};

/* gaveta do registro */
function detalhe(id){
  const e=EV.find(x=>x.id===id);
  const veu=document.createElement('div');veu.className='veu';
  const g=document.createElement('aside');g.className='gaveta';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');
  g.innerHTML=`<div class="dh"><div><span class="pill">${ic(CATS[e.cat][1])}${CATS[e.cat][0]}</span> <span class="mono" style="color:var(--mu);margin-left:6px">${e.id}</span><h2>${e.quem} ${e.verbo} <span class="mono" style="font-size:inherit">${e.obj[0]}</span></h2></div><button class="x" data-fechar aria-label="Fechar">${ic('x')}</button></div>
    <dl class="kv">
      <dt>Quando</dt><dd>${e.quando}</dd>
      <dt>Quem</dt><dd>${e.orig==='tela'?`<span class="av sm">${ini(e.quem)}</span>`:ic(e.orig==='bot'?'bot':'git')}${e.quem}${e.auto?' <span class="pill run">autoaprovação</span>':''}</dd>
      <dt>Origem</dt><dd>${ORIGEM[e.orig]}</dd>
      <dt>Aplicação</dt><dd>${e.app}</dd>
      <dt>Objeto</dt><dd><span class="mono">${e.obj[0]}</span> · ${e.obj[1]}</dd>
    </dl>
    <h3 class="sub">O que mudou</h3>
    <div class="box tw"><table class="dif"><thead><tr><th>Campo</th><th>Antes</th><th>Depois</th></tr></thead><tbody>${e.mud.map(([c,a,d])=>`<tr><td>${c}</td><td class="${a==='—'?'':'antes'}">${a}</td><td class="depois">${d}</td></tr>`).join('')}</tbody></table></div>
    ${e.motivo?`<h3 class="sub">Motivo</h3><div class="motivo-box">${e.motivo}</div>`:''}
    <div class="acoes dir"><button class="btn g" data-fechar>Fechar</button><a class="btn p" style="text-decoration:none" href="${e.obj[2]}">${ic('ext')}Abrir ${e.obj[0]}</a></div>`;
  const fechar=()=>{veu.remove();g.remove();document.removeEventListener('keydown',esc)};
  const esc=k=>{if(k.key==='Escape')fechar()};
  veu.onclick=fechar;g.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=fechar);document.addEventListener('keydown',esc);
  document.body.append(veu,g);g.querySelector('[data-fechar]').focus();
}

const sino=$('.sino'),avisos=$('#avisos');
const mostrar=x=>{avisos.hidden=!x;sino.setAttribute('aria-expanded',x)};
sino.onclick=e=>{e.stopPropagation();mostrar(avisos.hidden)};
document.addEventListener('click',e=>{if(!avisos.hidden&&!avisos.contains(e.target))mostrar(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')mostrar(false)});

crumb();desenhaSelects();lerHash();lista();
addEventListener('hashchange',()=>{lerHash();lista()});
</script>
