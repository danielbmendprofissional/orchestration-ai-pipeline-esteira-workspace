<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteira — Abrir Entrega (protótipo D1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
main{max-width:1180px}
[hidden]{display:none!important}
.lead{color:var(--mu);font-size:13px;margin:-2px 0 22px}
.num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--s3);border:1px solid var(--ln2);color:var(--tx2);font-size:13px;font-weight:700}
.num.ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-tx)}
.num .i{width:14px;height:14px;stroke-width:2.6}
.form2{display:grid;grid-template-columns:minmax(220px,300px) minmax(260px,1fr);gap:16px;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px}
.fld>span{color:var(--tx2);font-weight:600}
.fld small{color:var(--di);font-size:12px}
.rot-campo{color:var(--tx2);font-weight:600;font-size:13px;margin-bottom:8px}
.inp,.sel{padding:9px 12px;border:1px solid var(--ln2);border-radius:9px;background:var(--s1);color:var(--tx);font:inherit;outline:none}
textarea.inp{resize:vertical;min-height:72px}
.inp:focus,.sel:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0A4EE433}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opc{display:flex;gap:12px;border:1px solid var(--ln2);border-radius:10px;padding:14px 16px;background:var(--s1);cursor:pointer}
.opc:hover{border-color:#4A4A52}
.opc:has(input:checked){border-color:var(--blue2);background:var(--blue-bg)}
.opc:has(input:focus-visible){outline:2px solid var(--blue-tx);outline-offset:2px}
.opc input{accent-color:var(--blue2);width:16px;height:16px;margin-top:2px;flex:none}
.opc p{color:var(--mu);font-size:13px;margin:2px 0 10px}
.trilha{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--tx2)}
.trilha span{padding:2px 8px;border:1px solid var(--ln2);border-radius:6px;background:var(--s2);white-space:nowrap}
.trilha .i{width:12px;height:12px;color:var(--di)}
.cod{font-family:var(--mono);font-size:12.5px;color:var(--tx2);margin-right:8px}
.tt{font-weight:600}
.proj{display:inline-flex;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);border:1px solid var(--ln2);border-radius:6px;padding:1px 7px;margin-left:8px;white-space:nowrap}
.tag .i{width:12px;height:12px}
.pnome{font-weight:600;font-family:var(--mono);font-size:13px}
.sub2{color:var(--di);font-size:12.5px;margin-top:2px}
.fx{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(160px,1fr) 130px minmax(250px,1.3fr);gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
.fx:last-child{border-bottom:0}
.fxc{display:flex;flex-wrap:wrap;gap:4px}
.fxc .chip{font-size:12px;padding:3px 9px}
.hoje{font-size:12.5px;color:var(--mu)}
.vers{font-family:var(--mono);font-size:13px;color:var(--tx)}
.vers small{display:block;font-family:var(--sans);color:var(--di);font-size:12px;margin-top:2px}
.major{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.major input{accent-color:var(--blue2);width:16px;height:16px;margin-top:1px;flex:none}
.ordem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 4px 0;font-size:13px;color:var(--mu)}
.ordem .cad{display:inline-flex;align-items:center;gap:8px;color:var(--tx2);font-family:var(--mono);font-size:13px}
.ordem .cad .i{color:var(--mu)}
.rm{background:none;border:0;color:var(--mu);padding:4px;border-radius:6px}.rm:hover{color:var(--tx);background:var(--s3)}
.lk{color:var(--blue-tx);font-size:13px;display:inline-flex;align-items:center;gap:6px}.lk:hover{text-decoration:underline}
.motivo-hf{margin-top:16px;max-width:720px}
.faixas{display:grid;gap:10px;margin-bottom:18px}
.faixas .faixa{margin:0}
.faixas .faixa ul{margin:4px 0 0;padding-left:18px;color:var(--tx2)}
/* blocos de conferência no resumo (Q1) */
.conf{border:1px solid var(--ln);border-radius:10px;background:var(--s1);margin-top:12px;overflow:hidden}
.conf summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:13px;color:var(--tx2);list-style:none}
.conf summary::-webkit-details-marker{display:none}
.conf summary .i{color:var(--run-tx)}
.conf summary .chev{margin-left:auto;color:var(--mu);transition:transform .15s}
.conf[open] summary .chev{transform:rotate(90deg)}
.conf .corpo{border-top:1px solid var(--ln);padding:6px 0}
.conf .it{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--tx2)}
.conf .it .mono{min-width:128px}
.conf .it .d{margin-left:auto;color:var(--mu);font-size:12.5px}
#resumo .linha{min-height:48px}
.vazio{color:var(--di)}
@media (max-width:900px){
  .form2,.tipos{grid-template-columns:1fr}
  .fx{grid-template-columns:1fr}
}
</style></head>
<body data-pagina="painel">
<nav data-menu></nav>
<main>
  <div class="crumb"><svg class="i"><use href="#i-list"/></svg><a href="prototipo-painel-fatias.html" style="color:inherit">Painel de Fatias</a> <svg class="i"><use href="#i-chev"/></svg> Abrir Entrega · dados fictícios
    <label class="demo">Cenário <select data-cen>
      <option value="normal">Tudo certo</option>
      <option value="dep-fora">Fatia depende de outra que não está na main (impede)</option>
      <option value="dep-pub">Fatia depende de uma na main, ainda não publicada (avisa)</option>
      <option value="vermelha">main do Projeto com pipeline vermelha (recusa)</option>
      <option value="limpeza">Fatia sem flag excluída, limpeza pendente (bloqueia o Projeto)</option>
    </select></label></div>
  <div class="head"><h1>Abrir Entrega</h1></div>
  <p class="lead" data-lead></p>

  <div class="faixas" data-faixas></div>

  <!-- 1 -->
  <section class="panel" aria-labelledby="t1">
    <div class="ph"><h2 id="t1"><span class="num" data-num="1">1</span>Tipo e nome</h2><span data-st="1"></span></div>
    <div class="form2">
      <label class="fld"><span>Aplicação</span>
        <select class="sel" data-app><option value="valuto">Valuto</option><option value="portal">Portal do Cliente</option></select>
        <small data-grupo></small></label>
      <label class="fld"><span>Nome da Entrega</span>
        <input class="inp" data-nome placeholder="ex.: Cartões e exportação" maxlength="80">
        <small>Em linguagem de produto: é assim que ela aparece na lista, nos avisos e para o aprovador de negócio.</small></label>
    </div>
    <div class="rot-campo" id="rot-tipo">Tipo</div>
    <div class="tipos" role="radiogroup" aria-labelledby="rot-tipo">
      <label class="opc"><input type="radio" name="tipo" value="normal" checked><div><b>Normal</b><p>Fatias Prontas para Entrega, de qualquer mistura (API, front ou as duas). Passa por todas as etapas.</p><div class="trilha" data-trilha="normal"></div></div></label>
      <label class="opc"><input type="radio" name="tipo" value="hotfix"><div><b>Hotfix</b><p>Correção sobre o que está em produção. Um Projeto só, sem seleção de Fatias, versão PATCH. Usa o Atalho: pula QA e HML.</p><div class="trilha" data-trilha="hotfix"></div></div></label>
    </div>
  </section>

  <!-- 2 normal -->
  <section class="panel" aria-labelledby="t2" data-normal>
    <div class="ph"><h2 id="t2"><span class="num" data-num="2">2</span>Fatias da Entrega <span class="n" data-qtd></span></h2><span data-st="2"></span></div>
    <div class="box tw"><table><thead><tr><th>Fatia</th><th>Projeto</th><th>Risco</th><th></th></tr></thead><tbody data-fatias></tbody></table></div>
    <p class="txt" style="color:var(--mu);margin-top:10px"><a class="lk" href="prototipo-painel-fatias.html">Escolher outras no Painel de Fatias</a></p>
  </section>

  <!-- 3 normal -->
  <section class="panel" aria-labelledby="t3" data-normal>
    <div class="ph"><h2 id="t3"><span class="num" data-num="3">3</span>Fluxos e tipo da mudança</h2><span data-st="3"></span></div>
    <div class="box"><div data-fluxos></div></div>
    <div data-ordem></div>
  </section>

  <!-- hotfix -->
  <section class="panel" aria-labelledby="t4" data-hotfix hidden>
    <div class="ph"><h2 id="t4"><span class="num" data-num="4">2</span>Projeto e motivo</h2><span data-st="4"></span></div>
    <div class="box"><div data-hf-proj></div></div>
    <label class="fld motivo-hf"><span>Motivo do hotfix</span>
      <textarea class="inp" data-motivo placeholder="ex.: extrato de contas encerradas devolve erro 500 desde a v3.7.0"></textarea>
      <small>Obrigatório. O Atalho depois pede também o nome de quem ordenou, e o Publicador confirma a produção.</small></label>
    <div class="rot-campo" id="rot-orig" style="margin-top:18px">Como a correção será feita</div>
    <div class="tipos" role="radiogroup" aria-labelledby="rot-orig">
      <label class="opc"><input type="radio" name="orig" value="agente" checked><div><b>Issue de hotfix: o agente implementa</b><p>A Esteira cria no GitLab a issue <span class="mono">Hotfix: &lt;motivo&gt;</span>, com o motivo e o rótulo <span class="mono">ready-for-human</span>. Você roda o fluxo normal nela (spec, tickets e MR <span class="mono">hotfix/*</span>) e a Entrega só segue quando a MR estiver na <span class="mono">main</span>.</p></div></label>
      <label class="opc"><input type="radio" name="orig" value="humano"><div><b>Eu mesmo faço o código</b><p>Sem issue: você escreve a correção numa branch <span class="mono">hotfix/*</span> a partir da <span class="mono">main</span> e abre a MR. A aprovação continua sendo humana.</p><input class="inp" data-branch placeholder="hotfix/extrato-conta-encerrada (pode informar depois)" aria-label="Branch do hotfix" style="width:100%"></div></label>
    </div>
  </section>

  <!-- resumo -->
  <section class="panel" id="resumo" aria-labelledby="tr">
    <div class="ph"><h2 id="tr"><span class="ib"><svg class="i"><use href="#i-file"/></svg></span>Resumo</h2></div>
    <div class="resumo" data-resumo></div>
    <div data-conf></div>
  </section>
  <div class="barra-acao">
    <a class="btn g" href="prototipo-painel-fatias.html" style="text-decoration:none">Cancelar</a>
    <button class="btn p" data-abrir disabled><svg class="i"><use href="#i-layers"/></svg>Abrir Entrega</button>
  </div>
</main>

<script src="comum.js"></script>
<script>
const ic=(id,cls='')=>`<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const $=s=>document.querySelector(s);
const ETAPAS={normal:['Abertura','QA','HML','PRD','Liberação'],hotfix:['Abertura','PRD']};
const trilha=t=>ETAPAS[t].map(e=>`<span>${e}</span>`).join(ic('chev'));
document.querySelectorAll('[data-trilha]').forEach(d=>d.innerHTML=trilha(d.dataset.trilha));

/* dados fictícios. pub = maior versão já publicada (a numeração nunca volta); dep = "Depende de" do mapa */
const APPS={
 valuto:{nome:'Valuto',grupo:'valuto',projetos:{'valuto-api':{stack:'.NET',prd:'3.7.0',main:'verde'},'valuto-frontend':{stack:'Angular',prd:'2.0.3',main:'verde',dep:'valuto-api'}}},
 portal:{nome:'Portal do Cliente',grupo:'portal-cliente',projetos:{'portal-api':{stack:'.NET',prd:'2.2.0',main:'verde'},'portal-web':{stack:'Angular',prd:'1.8.0',main:'verde',dep:'portal-api'}}}};
/* Fatias Prontas para Entrega da aplicação */
const PRONTAS={
 valuto:[
  {c:'V6',t:'Cadastro de cartões',p:['Front'],r:'baixo',flag:true},
  {c:'V7',t:'Exportação em CSV',p:['API','Front'],r:'médio',flag:true},
  {c:'V8',t:'Limpeza do módulo legado de boleto',p:['API'],r:'alto',flag:false},
  {c:'V15',t:'Filtros salvos no extrato',p:['API'],r:'baixo',flag:true}],
 portal:[
  {c:'P2',t:'Menu lateral recolhível',p:['Front'],r:'baixo',flag:true},
  {c:'P4',t:'Preferências de notificação',p:['API','Front'],r:'médio',flag:true}]};
const SEM_FATIA={valuto:[['valuto-api','!66','Ajuste de log do job de conciliação','09/11'],['valuto-frontend','!41','Atualização de dependência do Angular','18/11']],portal:[]};
const LIMPEZAS={valuto:[['V16-L','Limpeza: relatório legado (sem flag, bloqueia)',true],['V14-L','Limpeza: cartão virtual (com flag)',false]],portal:[]};

const v=s=>s.split('.').map(Number),fmt=a=>a.join('.');
const proxima=(prd,major)=>{const b=v(prd);return major?[b[0]+1,0,0]:[b[0],b[1]+1,0]};
const patch=prd=>{const b=v(prd);return [b[0],b[1],b[2]+1]};

let st={app:'valuto',tipo:'normal',cen:'normal',fatias:[],major:{},hfProj:'',removidas:new Set()};
const A=()=>APPS[st.app],hf=()=>st.tipo==='hotfix',proj=id=>A().projetos[id];
const projDe=(f)=>f.p.map(x=>x==='API'?Object.keys(A().projetos)[0]:Object.keys(A().projetos)[1]);
function reinicia(){
  const hash=(location.hash.match(/fatias=([^&]*)/)||[])[1],pedidas=hash?hash.split(',').filter(Boolean):[];
  const l=PRONTAS[st.app];
  st.fatias=l.filter(f=>!f.flag||pedidas.includes(f.c)||(!pedidas.length&&f.c==='V6')).map(f=>f.c);
  st.major={};st.hfProj=Object.keys(A().projetos)[0];
}
const selecionadas=()=>PRONTAS[st.app].filter(f=>st.fatias.includes(f.c));
const fluxos=()=>{const m={};selecionadas().forEach(f=>projDe(f).forEach(p=>(m[p]=m[p]||[]).push(f)));return Object.entries(m).map(([id,fs])=>({id,fs,...proj(id)}))};
const ordem=()=>{const ids=fluxos().map(f=>f.id);return ids.sort((a,b)=>(proj(a).dep===b?1:0)-(proj(b).dep===a?1:0)||(proj(a).dep?1:0)-(proj(b).dep?1:0))};

/* regras do cenário (ADR-0022, 0023, 0025) */
function avisos(){
  const f=[],cen=st.cen,sel=selecionadas(),ids=fluxos().map(x=>x.id);
  if(cen==='dep-fora'&&!hf()&&sel.some(x=>x.c==='V7'))f.push(['bad','fail','Não dá para abrir: falta uma Fatia na main',`<span class="mono">V7</span> depende de <span class="mono">V2</span> (API), que ainda não está na <span class="mono">main</span> nem nesta Entrega. Espere a V2 ficar Pronta para Entrega ou tire a V7.`,true]);
  if(cen==='dep-pub'&&!hf()&&sel.some(x=>x.c==='V6'))f.push(['run','alert','Dependência já na main, ainda não publicada',`<span class="mono">V6</span> depende de <span class="mono">V9</span>, que está na <span class="mono">main</span> mas ainda não foi publicada em produção. Pode abrir: o front pode estar em QA enquanto a API está em HML.`,false]);
  if(cen==='vermelha'&&!hf())f.push(['bad','fail','Não dá para abrir: a main está vermelha',`A pipeline da <span class="mono">main</span> de <span class="mono">${ids[0]||'valuto-api'}</span> está vermelha. A Esteira recusa abrir Entrega até o último SHA ficar verde.`,true]);
  if(cen==='limpeza'&&ids.includes('valuto-api')&&!hf())f.push(['bad','lock','Projeto bloqueado por limpeza pendente',`A Fatia sem flag <span class="mono">V16</span> foi excluída e a limpeza <span class="mono">V16-L</span> ainda não foi mergeada: o código dela vai em todo Artefato de <span class="mono">valuto-api</span>. Só dá para abrir Entrega nova deste Projeto depois da limpeza. <b>Hotfix continua permitido.</b>`,true]);
  if(cen==='limpeza'&&hf())f.push(['cinza','lock','Limpeza pendente em valuto-api',`O hotfix é a saída de emergência: abre mesmo com a limpeza <span class="mono">V16-L</span> pendente.`,false]);
  return f;
}
const bloqueia=()=>avisos().some(a=>a[4]);

/* painéis */
function desenhaFatias(){
  const sel=selecionadas();$('[data-qtd]').textContent=sel.length;
  $('[data-fatias]').innerHTML=sel.length?sel.map(f=>`<tr><td><span class="cod">${f.c}</span><span class="tt">${f.t}</span>${!f.flag?`<span class="tag" title="Fatia sem flag: vem marcada e travada. Vira Liberada ao chegar a produção">${ic('lock')}sem flag · travada</span>`:''}</td>
    <td><span class="proj">${f.p.map(x=>`<span class="chip">${ic(x==='API'?'server':'monitor')}${x}</span>`).join('')}</span></td><td>${f.r}</td>
    <td class="dir">${f.flag?`<button class="rm" data-tira="${f.c}" title="Tirar da Entrega" aria-label="Tirar ${f.c} da Entrega">${ic('x')}</button>`:`<span title="Não dá para tirar uma Fatia sem flag">${ic('lock')}</span>`}</td></tr>`).join('')
    :`<tr><td colspan="4" style="text-align:center;color:var(--mu);padding:22px">Nenhuma Fatia. Volte ao Painel de Fatias e marque as que vão nesta Entrega.</td></tr>`;
  document.querySelectorAll('[data-tira]').forEach(b=>b.onclick=()=>{st.fatias=st.fatias.filter(x=>x!==b.dataset.tira);tudo()});
}
function desenhaFluxos(){
  const fx=fluxos();
  $('[data-fluxos]').innerHTML=fx.length?fx.map(f=>{const mj=!!st.major[f.id],nv=fmt(proxima(f.prd,mj));
    return `<div class="fx"><div><div class="pnome">${f.id}</div><div class="sub2">${f.stack}${f.dep?` · depende de ${f.dep}`:''}</div></div>
      <div class="fxc" title="Fatias que este Fluxo leva">${f.fs.map(x=>`<span class="chip"><span class="mono">${x.c}</span></span>`).join('')}</div>
      <div class="hoje">em produção<br><span class="vers" style="color:var(--tx2)">v${f.prd}</span></div>
      <div><label class="major"><input type="checkbox" data-major="${f.id}" ${mj?'checked':''}><span>Esta mudança quebra a compatibilidade com a versão anterior?</span></label>
        <div class="vers" style="margin-top:8px">${mj?'major':'minor'} → v${nv}<small>prevista: o número definitivo só nasce na confirmação em produção</small></div></div></div>`}).join('')
    :`<div class="empty" style="border:0">${ic('layers','lg')}Escolha as Fatias para ver os Fluxos</div>`;
  document.querySelectorAll('[data-major]').forEach(c=>c.onchange=()=>{st.major[c.dataset.major]=c.checked;tudo()});
  const o=ordem();
  $('[data-ordem]').innerHTML=fx.length>1?`<div class="ordem" title="Os Fluxos andam e liberam nessa ordem; num rollback, voltam na ordem inversa">${ic('branch')}<span>Ordem</span><span class="cad">${o.join(` ${ic('arrow')} `)}</span><span class="pill" title="Pelo Depende de do mapa">do mapa</span></div>`:'';
}
function desenhaHf(){
  $('[data-hf-proj]').innerHTML=Object.entries(A().projetos).map(([id,p])=>`<label class="fx" style="grid-template-columns:24px 1fr 130px 1fr;cursor:pointer"><input type="radio" name="hfp" value="${id}" ${st.hfProj===id?'checked':''} style="accent-color:var(--blue2)"><div><div class="pnome">${id}</div><div class="sub2">${p.stack}</div></div><div class="hoje">em produção<br><span class="vers" style="color:var(--tx2)">v${p.prd}</span></div><div class="vers">patch → v${fmt(patch(p.prd))}<small>o número definitivo só nasce na confirmação em produção</small></div></label>`).join('');
  document.querySelectorAll('[name=hfp]').forEach(r=>r.onchange=()=>{st.hfProj=r.value;tudo()});
}

const orig=()=>document.querySelector('[name=orig]:checked')?.value||'agente';
function origTxt(){const m=($('[data-motivo]').value||'').trim();return orig()==='agente'?`<span class="pill">${ic('issue')}Issue de hotfix criada no GitLab</span><span class="mono">Hotfix: ${m?m.slice(0,48):'…'}</span>`:`<span class="pill">${ic('code')}Código feito por você</span><span class="mono">${($('[data-branch]').value||'').trim()||'branch hotfix/* a informar'}</span>`}
function falta(){
  const f={1:[],2:[],3:[],4:[]};
  if(!$('[data-nome]').value.trim())f[1].push('dê um nome à Entrega');
  if(hf()){if(!$('[data-motivo]').value.trim())f[4].push('informe o motivo do hotfix')}
  else{if(!st.fatias.length){f[2].push('escolha ao menos uma Fatia');f[3].push('sem Fatias não há Fluxos')}}
  avisos().filter(a=>a[4]).forEach(a=>f[hf()?4:2].push(a[2].toLowerCase()));
  return f;
}
function tudo(){
  document.querySelectorAll('[data-normal]').forEach(s=>s.hidden=hf());
  document.querySelectorAll('[data-hotfix]').forEach(s=>s.hidden=!hf());
  $('[data-grupo]').innerHTML=`Grupo do GitLab <span class="mono">${A().grupo}</span> · ${Object.keys(A().projetos).length} projetos`;
  $('[data-lead]').textContent=hf()?'Hotfix sobre produção, de um Projeto só. A correção nasce de uma issue (feita pelo agente) ou do seu próprio código; depois de na main, vai para o Atalho e para a confirmação do Publicador.':'Uma Entrega é de uma Aplicação só. Depois de aberta, a Esteira cria um Fluxo por Projeto tocado e gera o Artefato sobre o último SHA verde da main.';
  desenhaFatias();desenhaFluxos();desenhaHf();
  $('[data-faixas]').innerHTML=avisos().map(([cor,icone,tit,txt])=>`<div class="faixa ${cor}">${ic(icone)}<div><b>${tit}</b><p>${txt}</p></div></div>`).join('');
  const f=falta(),nums=hf()?[1,4]:[1,2,3];
  nums.forEach(n=>{const ok=!f[n].length,num=$(`[data-num="${n}"]`);num.classList.toggle('ok',ok);num.innerHTML=ok?ic('check'):(n===4?2:n);
    $(`[data-st="${n}"]`).innerHTML=ok?`<span class="stat ok">${ic('ok')}Completo</span>`:`<span class="stat none" title="${f[n].join('; ')}">${ic('none')}Pendente</span>`});
  const todas=nums.flatMap(n=>f[n]),ab=$('[data-abrir]');ab.disabled=!!todas.length;ab.title=todas.length?'Falta: '+todas.join('; '):'';
  resumo();
}
function resumo(){
  const nome=$('[data-nome]').value.trim(),linha=(i,r,val)=>`<div class="linha"><span class="rot">${ic(i)}${r}</span><span class="val">${val}</span></div>`;
  const pend=t=>`<span class="stat none">${ic('none')}${t}</span>`,fx=fluxos(),o=ordem();
  $('[data-resumo]').innerHTML=
   linha('grid','Aplicação',`${A().nome} <span class="mono" style="color:var(--di)">grupo ${A().grupo}</span>`)+
   linha('layers','Entrega',nome||pend('sem nome'))+
   linha('tag','Tipo',hf()?'<span class="pill">Hotfix · PATCH</span>':'<span class="pill">Normal</span>')+
   (hf()?linha('box','Projeto',`<span class="pill">${ic('box')}<span class="mono">${st.hfProj} · v${fmt(patch(proj(st.hfProj).prd))}</span></span>`)+linha('git','Correção',origTxt())
    :linha('list','Fatias',selecionadas().length?selecionadas().map(f=>`<span class="mono">${f.c}</span>`).join(', ')+` <span class="n">${selecionadas().length}</span>`:pend('nenhuma'))+
     linha('box','Fluxos',fx.length?o.map(id=>{const f=fx.find(x=>x.id===id),mj=!!st.major[id];return `<span class="pill">${ic('box')}<span class="mono">${id} · ${mj?'major':'minor'} → v${fmt(proxima(f.prd,mj))}</span></span>`}).join(ic('arrow')):pend('nenhum')))+
   linha('git','Etapas',`<span class="trilha">${trilha(st.tipo)}</span>`);
  /* conferência de escopo: três blocos recolhidos, só avisam e nunca bloqueiam */
  const sel=st.fatias,vaoJunto=hf()?[]:PRONTAS[st.app].filter(f=>!sel.includes(f.c)),sem=hf()?[]:SEM_FATIA[st.app],lim=LIMPEZAS[st.app];
  const bloco=(icone,tit,n,corpo)=>n?`<details class="conf"><summary>${ic(icone)}${tit} <span class="n">${n}</span>${ic('chev','chev')}</summary><div class="corpo">${corpo}</div></details>`:'';
  $('[data-conf]').innerHTML=
   bloco('alert','Vão junto, com o flag desligado',vaoJunto.length,vaoJunto.map(f=>`<div class="it"><span class="mono">${f.c}</span><span>${f.t}</span><span class="d">Pronta para Entrega · vai no Artefato porque a main é cumulativa</span></div>`).join(''))+
   bloco('alert','MRs mergeadas sem Fatia',sem.length,sem.map(([p,mr,t,d])=>`<div class="it"><span class="mono">${p} ${mr}</span><span>${t}</span><span class="d">mergeada em ${d} · só avisa</span></div>`).join(''))+
   bloco('lock','Limpezas pendentes do Projeto',lim.length,lim.map(([c,t,b])=>`<div class="it"><span class="mono">${c}</span><span>${t}</span><span class="d">${b?'bloqueia nova Entrega do Projeto':'não bloqueia'}</span></div>`).join(''));
}

/* eventos */
$('[data-app]').onchange=e=>{st.app=e.target.value;reinicia();tudo()};
$('[data-cen]').onchange=e=>{st.cen=e.target.value;tudo()};
document.querySelectorAll('[name=tipo]').forEach(r=>r.onchange=()=>{st.tipo=r.value;tudo()});
$('[data-nome]').oninput=tudo;$('[data-motivo]').oninput=tudo;$('[data-branch]').oninput=tudo;document.querySelectorAll('[name=orig]').forEach(r=>r.onchange=tudo);
$('[data-abrir]').onclick=()=>location.href='prototipo-entrega.html';
if(/#tipo=hotfix/.test(location.hash)){st.tipo='hotfix';document.querySelector('[name=tipo][value=hotfix]').checked=true}
reinicia();tudo();
</script>
</body></html>
