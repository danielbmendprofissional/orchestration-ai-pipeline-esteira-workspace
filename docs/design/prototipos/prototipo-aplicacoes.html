<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteira — Aplicações (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
[hidden]{display:none!important}
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.topo h1{margin-right:auto}
.filtrobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.campo{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--ln2);border-radius:9px;background:var(--s1);color:var(--mu);min-width:260px}
.campo:focus-within{border-color:var(--blue2);box-shadow:0 0 0 3px #0A4EE433}
.campo input{border:0;background:none;color:var(--tx);font:inherit;outline:none;width:100%}
.inp,.sel{padding:8px 11px;border:1px solid var(--ln2);border-radius:9px;background:var(--s1);color:var(--tx);font:inherit;outline:none}
.inp:focus,.sel:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0A4EE433}
.inp.erro,.sel.erro{border-color:var(--bad-ln);box-shadow:0 0 0 3px #F8514922}
.inp[readonly]{color:var(--tx2);background:var(--s2)}
.inp.mono{font-family:var(--mono);font-size:13px}
.sel.sm,.inp.sm{padding:5px 9px;font-size:13px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:16px}
.fld>span{color:var(--tx2);font-weight:600}
.fld small{color:var(--di);font-size:12px}.fld small.erro{color:var(--bad-tx)}.fld small.ok{color:var(--ok-tx)}
.lado{display:grid;grid-template-columns:1fr 110px;gap:12px}
.dic{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.obs{display:block;color:var(--mu);font-size:12.5px;margin-top:14px}
.obs .i{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
table.mat td:first-child{white-space:nowrap}

/* lista */
.lista{border:1px solid var(--ln);border-radius:12px;background:var(--s1);box-shadow:inset 0 1px 0 var(--hl);overflow:hidden}
.cab,.apl{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(140px,1fr) 90px 130px minmax(160px,1fr) 20px;gap:16px;align-items:center;padding:0 20px}
.cab{height:38px;color:var(--di);font-size:12px;border-bottom:1px solid var(--ln);background:var(--s2)}
.apl{min-height:60px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--ln);color:inherit;text-decoration:none}
.apl:last-child{border-bottom:0}.apl:hover{background:var(--s2)}
.apl.inativa{color:var(--mu)}
.nome{display:flex;align-items:center;gap:8px;font-weight:600}
.papeis{display:flex;gap:4px;flex-wrap:wrap}
.sub2{color:var(--di);font-size:12.5px;margin-top:2px}
.pagl{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mu);font-size:13px}
.nums{display:flex;gap:4px}
.nums button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx2)}
.nums button.on{border-color:var(--blue2);background:var(--blue-bg);color:#fff}
.nums button:disabled{opacity:.4;cursor:not-allowed}

/* detalhe */
.so-leitura{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12.5px;margin-bottom:14px}
.so-leitura .i{width:14px;height:14px}
.ech{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid var(--ln2);color:var(--tx2);margin-right:3px}
.ech.off{border-style:dashed;color:var(--di);text-decoration:line-through}
tr.inativo td{color:var(--mu)}
.tg{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--s3);border:1px solid var(--ln2);position:relative;cursor:pointer;flex:none;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mu);transition:left .15s}
.tg:checked{background:var(--blue);border-color:var(--blue2)}
.tg:checked::after{left:14px;background:#fff}
.tg:disabled{opacity:.5;cursor:not-allowed}
.tg:focus-visible{outline:2px solid var(--blue-tx);outline-offset:2px}

/* matriz projetos × ambientes */
table.mat td{vertical-align:top;white-space:normal}
table.mat th.amb,table.mat td.amb{min-width:150px}
.dests{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.dn{background:none;border:0;padding:0;font-family:var(--mono);font-size:12.5px;color:var(--tx2);text-align:left}
.dn:hover{color:#fff;text-decoration:underline}
.mais-d{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:2px 0 0;color:var(--di);font-size:12px}
.mais-d:hover{color:var(--blue-tx)}.mais-d .i{width:13px;height:13px}
.desab{color:var(--ln2)}
.semd{display:inline-flex;align-items:center;gap:5px;color:var(--run-tx);font-size:12.5px}.semd .i{width:13px;height:13px}

/* política em tabela */
table.pol td,table.pol th{text-align:center}
table.pol td:first-child,table.pol th:first-child{text-align:left}
table.pol th small{display:block;font-weight:400;color:var(--di);font-size:11.5px;margin-top:2px}
table.pol th small.endu{color:var(--tx2);font-weight:600}
table.pol .inp{width:96px;padding:5px 8px;font-family:var(--mono);font-size:12.5px;text-align:right}
table.pol .inp::placeholder{font-family:var(--sans);font-size:12px}
table.pol .inp::-webkit-inner-spin-button{display:none}
table.pol .inp:disabled{opacity:.45}
.travado{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-family:var(--mono);font-size:12.5px}
.travado .i{width:13px;height:13px}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:8px;padding:2px;background:var(--s1)}
.seg button{border:0;background:none;color:var(--mu);padding:4px 9px;border-radius:6px;font-size:12px;font-weight:600}
.seg button.on{background:var(--s3);color:#fff;box-shadow:inset 0 1px 0 var(--hl)}
.seg button:disabled{cursor:not-allowed}
.sevn{display:inline-flex;align-items:center;gap:8px}

.mor-g{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);margin-bottom:12px}
table.pap td.c,table.pap th.c{text-align:center}
table.pap th.c{cursor:help}
table.pap input{width:16px;height:16px;accent-color:var(--blue2)}
.pessoa{display:flex;align-items:center;gap:10px}.pessoa small{display:block;color:var(--di);font-size:12px}
tr.nova td{background:#0A4EE40D}
.erro-tx{color:var(--bad-tx);font-size:12px;margin-top:4px;white-space:normal}
.links{display:flex;gap:22px;flex-wrap:wrap}

/* gaveta */
.acoes.dir{justify-content:flex-end;flex-wrap:wrap}.acoes .esq{margin-right:auto}
.gaveta .kv{margin-bottom:18px}
.ambs-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ambs-g label{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--ln2);border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.ambs-g .i{width:13px;height:13px;color:var(--di)}
.cfg{display:grid;gap:8px}
.cfg-l,.cfg-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 30px;gap:8px;align-items:start}
.cfg-l .inp{font-family:var(--mono);font-size:12.5px;width:100%;padding:7px 9px}
.cfg-h{font-size:12px;color:var(--di)}
.add-d{border:1px dashed var(--ln2);background:none;color:var(--mu);border-radius:8px;padding:7px;font-size:12px;display:flex;gap:6px;justify-content:center;align-items:center;width:100%;margin-top:8px}
.add-d:hover{color:var(--tx);border-color:#4A4A52}
.segredo{display:flex;gap:10px;border:1px solid var(--bad-ln);background:var(--bad-bg);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--tx2);margin-top:12px}
.segredo .i{color:var(--bad-tx);margin-top:2px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);font-size:13px}
.ck:last-child{border-bottom:0}
.ck input{width:16px;height:16px;accent-color:var(--blue2)}
.ck.ja{opacity:.5}
.ck .sel{margin-left:auto}
.dica-g{color:var(--di);font-size:12px}

@media (max-width:1100px){.cab{display:none}.apl{grid-template-columns:1fr}}
@media (max-width:520px){.ambs-g{grid-template-columns:repeat(2,1fr)}.lado{grid-template-columns:1fr}}
</style></head>
<body data-pagina="aplicacoes">
<nav data-menu></nav>
<main>
  <div class="crumb" data-crumb></div>

  <section data-vista="lista">
    <div class="topo">
      <h1>Aplicações</h1>
      <button class="btn p" data-nova><svg class="i"><use href="#i-plus"/></svg>Nova aplicação</button>
    </div>
    <div class="filtrobar">
      <label class="campo"><svg class="i"><use href="#i-search"/></svg><input type="search" placeholder="Buscar por nome, sigla ou grupo" data-busca aria-label="Buscar aplicação"></label>
      <button class="f on" data-st="ativas">Ativas <span class="n" data-c="ativas"></span></button>
      <button class="f" data-st="inativas">Inativas <span class="n" data-c="inativas"></span></button>
      <button class="f" data-st="todas">Todas <span class="n" data-c="todas"></span></button>
    </div>
    <div class="lista" data-lista-box>
      <div class="cab" data-cab></div>
      <div data-lista></div>
    </div>
    <div class="pagl"><span data-pag-info></span><div class="nums" data-nums></div></div>
  </section>

  <section data-vista="det" hidden>
    <div class="head"><h1><span data-d-nome></span> <span data-d-estado></span></h1>
      <div class="acoes-topo">
        <div class="sino-wrap">
          <button class="sino" aria-label="2 itens aguardando você" aria-expanded="false" aria-controls="avisos"><svg class="i"><use href="#i-bell"/></svg><span class="bolinha">2</span></button>
          <div class="avisos" id="avisos" role="dialog" aria-label="Aguardando você" hidden>
            <div class="av-h">Aguardando você</div>
            <div class="av-i"><svg class="i" style="color:var(--run-tx)"><use href="#i-wait"/></svg><div><b>Aprovar candidata v4.0.0-rc2</b><p>valuto-api em QA · agentes aprovaram · 1 alta coberta por exceção</p><div class="acts"><button class="btn p"><svg class="i"><use href="#i-check"/></svg>Aprovar</button><button class="btn g">Reprovar</button></div></div></div>
            <div class="av-i"><svg class="i" style="color:var(--run-tx)"><use href="#i-alert"/></svg><div><b>Exceção SEC-2291 vence em 4 dias</b><p>Opengrep · csharp-sqli · valuto-api</p><div class="acts"><button class="btn g">Revisar</button></div></div></div>
          </div>
        </div>
        <button class="btn g"><svg class="i"><use href="#i-ext"/></svg>Abrir no GitLab</button>
        <button class="btn g" data-editar><svg class="i"><use href="#i-file"/></svg>Editar aplicação</button>
      </div></div>
    <div class="meta" data-d-meta></div>
    <section class="panel">
      <div class="ph"><h2><span class="ib"><svg class="i"><use href="#i-grid"/></svg></span>Cadastro</h2></div>
      <div class="tabs" role="tablist">
        <button class="tab on" data-aba="projetos"><svg class="i"><use href="#i-box"/></svg>Projetos <span class="n" data-n-proj></span></button>
        <button class="tab" data-aba="ambientes"><svg class="i"><use href="#i-server"/></svg>Ambientes e destinos</button>
        <button class="tab" data-aba="politica"><svg class="i"><use href="#i-shield"/></svg>Política de segurança</button>
        <button class="tab" data-aba="papeis"><svg class="i"><use href="#i-users"/></svg>Pessoas e papéis <span class="n" data-n-pes></span></button>
      </div>
      <div id="aba" aria-live="polite"></div>
    </section>
    <div class="barra-acao" id="barra"></div>
  </section>
</main>

<script src="comum.js"></script>
<script>
const ic=(id,cls='')=>`<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));

/* quem está vendo (cenário de demonstração) */
const QUEM={mor:{nome:'Daniel',ini:'DB',rot:'MOR'},analista:{nome:'Ana Souza',ini:'AS',rot:'Analista'},aprovador:{nome:'Bruno Lima',ini:'BL',rot:'Aprovador técnico'},membro:{nome:'Diego Rocha',ini:'DR',rot:'Membro'}};
let quem='mor';
const pode={criar:()=>quem==='mor',cad:()=>quem==='mor'||quem==='analista',pol:()=>quem==='mor'||quem==='aprovador',pap:()=>quem==='mor'};

const APLS=[
 ['Valuto','VLT','valuto',3,7,6,true,{analista:['Analista','Membro'],aprovador:['Aprovador técnico','Membro'],membro:['Membro']},'valuto-api, valuto-frontend, valuto-batch'],
 ['Portal do Cliente','PCL','portal-cliente',2,5,3,true,{analista:['Analista'],membro:['Membro']},'portal-api, portal-web'],
 ['Cobrança Pix','CPX','cobranca-pix',4,6,1,true,{aprovador:['Aprovador técnico']},'cpx-api, cpx-web, cpx-worker, cpx-gateway'],
 ['Gestão de Contratos','GCT','contratos',3,8,2,true,{membro:['Membro']},'contratos-api, contratos-web, contratos-batch'],
 ['Cadastro Único','CDU','cadastro-unico',2,4,0,true,{},'cdu-api, cdu-web'],
 ['Ouvidoria','OUV','ouvidoria',1,3,0,true,{},'ouvidoria-web'],
 ['Folha de Pagamento','FPG','folha',2,5,1,true,{},'folha-api, folha-web'],
 ['Agenda de Serviços','AGS','agenda',2,3,0,true,{},'agenda-api, agenda-web'],
 ['Protocolo Digital','PTD','protocolo',3,6,1,true,{},'protocolo-api, protocolo-web, protocolo-ocr'],
 ['Licitações','LCT','licitacoes',2,4,0,true,{},'licitacoes-api, licitacoes-web'],
 ['Indicadores','IND','indicadores',1,2,0,true,{},'indicadores-web'],
 ['Portal da Transparência','PTR','transparencia',2,5,1,true,{},'transparencia-api, transparencia-web'],
 ['Atendimento por chat','ATC','atendimento',2,3,0,false,{},'atendimento-api, atendimento-web'],
 ['Arquivo legado','ARQ','arquivo',1,1,0,false,{},'arquivo-web']
].map(([nome,sigla,grupo,proj,pes,abertas,ativa,papeis,lista])=>({nome,sigla,grupo,proj,pes,abertas,ativa,papeis,lista}));
const visiveis=()=>APLS.filter(a=>quem==='mor'||a.papeis[quem]);

const STACK={dotnet:'.NET',angular:'Angular',outro:'outro'},AMBS=['dev','qa','hml','prd'],AMB_N={dev:'DEV',qa:'QA',hml:'HML',prd:'PRD'};
const SEVS=[['critica','Crítica','var(--bad)'],['alta','Alta','var(--run)'],['media','Média','#C9B458'],['baixa','Baixa','var(--low)']];
const PAPEIS=[['analista','Analista','Mantém projetos, ambientes, destinos e a configuração de publicação'],['membro','Membro','Abre entrega, corta nova candidata, reexecuta'],['aprovador-tecnico','Aprovador técnico','Aprova proposta, candidata e entrega; aprova exceções; ajusta a política de segurança'],['aprovador-negocio','Aprovador de negócio','Aprovação de negócio, issue por issue, lendo as notas de entrega'],['publicador','Publicador','Publica em produção']];
const SEGREDO=/PASSWORD|SENHA|SECRET|TOKEN|KEY|CREDENTIAL/i;
const dst=(nome,ordem,cfg)=>({nome,ordem,cfg:Object.entries(cfg)});
let dados={
 projetos:[{id:'valuto-api',stack:'dotnet',prd:'3.4.1',dep:'',ativo:true,branches:'dev, qa, hml, main'},{id:'valuto-frontend',stack:'angular',prd:'2.0.3',dep:'valuto-api',ativo:true,branches:'dev, qa, hml, main'},{id:'valuto-batch',stack:'outro',prd:'1.2.0',dep:'valuto-api',ativo:true,branches:'dev, main'}],
 amb:{
  'valuto-api':{dev:{on:true,d:[dst('k3d-dev / no-1',1,{KUBE_CONTEXT:'k3d-dev',NAMESPACE:'valuto',REPLICAS:'2',INGRESS_HOST:'api.valuto.dev.local'}),dst('k3d-dev / no-2',2,{KUBE_CONTEXT:'k3d-dev-2',NAMESPACE:'valuto',REPLICAS:'1',INGRESS_HOST:'api2.valuto.dev.local'})]},
   qa:{on:true,d:[dst('k3d-qa / valuto',1,{KUBE_CONTEXT:'k3d-qa',NAMESPACE:'valuto',REPLICAS:'2',INGRESS_HOST:'api.valuto.qa.local'})]},
   hml:{on:true,d:[dst('k3d-hml / valuto',1,{KUBE_CONTEXT:'k3d-hml',NAMESPACE:'valuto',REPLICAS:'2',INGRESS_HOST:'api.valuto.hml.local'})]},
   prd:{on:true,d:[dst('prd-sp / valuto',1,{KUBE_CONTEXT:'prd-sp',NAMESPACE:'valuto',REPLICAS:'4',INGRESS_HOST:'api.valuto.com.br'}),dst('prd-rj / valuto',2,{KUBE_CONTEXT:'prd-rj',NAMESPACE:'valuto',REPLICAS:'4',INGRESS_HOST:'api.valuto.com.br'})]}},
  'valuto-frontend':{dev:{on:true,d:[dst('k3d-dev / no-1',1,{KUBE_CONTEXT:'k3d-dev',NAMESPACE:'valuto',INGRESS_HOST:'valuto.dev.local'})]},qa:{on:true,d:[dst('k3d-qa / valuto',1,{KUBE_CONTEXT:'k3d-qa',NAMESPACE:'valuto',INGRESS_HOST:'valuto.qa.local'})]},
   hml:{on:true,d:[dst('k3d-hml / valuto',1,{KUBE_CONTEXT:'k3d-hml',NAMESPACE:'valuto',INGRESS_HOST:'valuto.hml.local'})]},prd:{on:true,d:[dst('prd-sp / valuto',1,{KUBE_CONTEXT:'prd-sp',NAMESPACE:'valuto',INGRESS_HOST:'valuto.com.br'})]}},
  'valuto-batch':{dev:{on:true,d:[dst('k3d-dev / jobs',1,{KUBE_CONTEXT:'k3d-dev',NAMESPACE:'valuto-jobs',SCHEDULE:'0 3 * * *'})]},qa:{on:false,d:[]},hml:{on:false,d:[]},prd:{on:true,d:[]}}},
 pol:{dev:{modo:'avisa',lim:{critica:'',alta:'',media:'',baixa:''}},qa:{modo:'bloqueia',lim:{critica:0,alta:0,media:'',baixa:''}},hml:{modo:'bloqueia',lim:{critica:0,alta:0,media:'',baixa:''}},prd:{modo:'bloqueia',lim:{critica:0,alta:0,media:5,baixa:''}}},
 papeis:[{n:'Ana Souza',u:'ana.souza',p:['analista','membro']},{n:'Bruno Lima',u:'bruno.lima',p:['membro','aprovador-tecnico']},{n:'Carla Mendes',u:'carla.mendes',p:['aprovador-tecnico','publicador']},{n:'Diego Rocha',u:'diego.rocha',p:['membro']},{n:'Elisa Prado',u:'elisa.prado',p:['aprovador-negocio']},{n:'Fábio Nunes',u:'fabio.nunes',p:['publicador']},{n:'Gabi Torres',u:'gabi.torres',p:['membro']}]
};
let salvo=clone(dados);
const padrao=a=>a==='dev'?{modo:'avisa',lim:{critica:'',alta:'',media:'',baixa:''}}:{modo:'bloqueia',lim:{critica:0,alta:0,media:'',baixa:''}};
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

let atual=null,aba='projetos',pagina=0;
function rota(){
  const m=/app=(\w+)/.exec(location.hash),a=m&&visiveis().find(x=>x.sigla===m[1]);
  atual=a||null;
  $('[data-vista=lista]').hidden=!!atual;$('[data-vista=det]').hidden=!atual;
  crumb();
  if(atual)detalhe();else lista();
}
function crumb(){
  $('[data-crumb]').innerHTML=`${ic('grid')}${atual?`<a href="#" style="color:inherit">Aplicações</a> ${ic('chev')} ${atual.nome}`:'Aplicações'} · dados fictícios
   <label class="demo">Ver como <select data-quem>${Object.entries(QUEM).map(([k,q])=>`<option value="${k}" ${k===quem?'selected':''}>${q.nome} · ${q.rot}</option>`).join('')}</select></label>`;
  $('[data-quem]').onchange=e=>{quem=e.target.value;$('.me').innerHTML=`<span class="av">${QUEM[quem].ini}</span><div>${QUEM[quem].nome}<small>${quem==='mor'?'MOR':'sem papel global'}</small></div>`;rota()};
}

/* ---------- lista ---------- */
function lista(){
  const mor=quem==='mor';
  $('[data-nova]').hidden=!pode.criar();

  $('[data-cab]').innerHTML=`<span>Aplicação</span><span>Grupo do GitLab</span><span>Projetos</span><span>Entregas abertas</span><span>Seus papéis</span><span></span>`;
  const st=$('[data-st].on').dataset.st,q=$('[data-busca]').value.toLowerCase();
  const filtra=s=>visiveis().filter(a=>(s==='todas'||(s==='ativas')===a.ativa)&&(a.nome+a.sigla+a.grupo).toLowerCase().includes(q));
  document.querySelectorAll('[data-c]').forEach(c=>c.textContent=filtra(c.dataset.c).length);
  const l=filtra(st),POR=8,paginas=Math.max(1,Math.ceil(l.length/POR));pagina=Math.min(Math.max(pagina,0),paginas-1);
  $('[data-lista]').innerHTML=l.length?l.slice(pagina*POR,pagina*POR+POR).map(a=>`<a class="apl${a.ativa?'':' inativa'}" href="#app=${a.sigla}" title="Projetos: ${a.lista} · ${a.pes} pessoas com papel">

function gaveta(html,ligar){
  const veu=document.createElement('div');veu.className='veu';
  const g=document.createElement('aside');g.className='gaveta';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.innerHTML=html;
  const fechar=()=>{veu.remove();g.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')fechar()};
  veu.onclick=fechar;g.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=fechar);document.addEventListener('keydown',esc);
  document.body.append(veu,g);ligar?.(g,fechar);(g.querySelector('input:not([readonly]):not(:disabled),select:not(:disabled)')||g.querySelector('[data-fechar]')).focus();
}

function editarDestino(pid,amb,i){

      box.querySelectorAll('[data-k]').forEach(n=>n.oninput=()=>{d.cfg[+n.dataset.k][0]=n.value;n.classList.toggle('erro',SEGREDO.test(n.value));valida()});

    const valida=()=>{

  const cab=x=>{const endu=JSON.stringify(P[x])!==JSON.stringify(padrao(x));return `<th>${AMB_N[x]}<small class="${endu?'endu':''}">${endu?'endurecida':'padrão'}</small></th>`};
  const modo=x=>x==='dev'?`<span class="seg" role="group" aria-label="Modo em DEV"><button data-modo="avisa" class="${P.dev.modo==='avisa'?'on':''}" ${ed?'':'disabled'}>Avisa</button><button data-modo="bloqueia" class="${P.dev.modo==='bloqueia'?'on':''}" ${ed?'':'disabled'}>Bloqueia</button></span>`
    :`<span class="travado" style="font-family:inherit;font-size:13px" title="Piso fixo: em ${AMB_N[x]} sempre bloqueia">Bloqueia ${ic('lock')}</span>`;
  const cel=(x,k,n)=>x!=='dev'&&(k==='critica'||k==='alta')?`<span class="travado" title="Piso fixo: ${n.toLowerCase()} em ${AMB_N[x]} só passa com exceção">0 ${ic('lock')}</span>`
    :`<input class="inp" type="number" min="0" data-lim="${x}|${k}" value="${P[x].lim[k]}" placeholder="${P[x].modo==='avisa'?'só avisa':'sem limite'}" ${ed&&P[x].modo==='bloqueia'?'':'disabled'} aria-label="Máximo de ${n} sem exceção em ${AMB_N[x]}">`;
  $('#aba').innerHTML=(ed?'':soLeitura('Aprovador técnico ou MOR'))+`<div class="box tw"><table class="pol"><thead><tr><th><span class="dic" title="Número = quantas passam sem exceção (0 = nenhuma). Vazio = sem limite.">Máximo sem exceção</span></th>${AMBS.map(cab).join('')}</tr></thead><tbody>
      <tr><td>Modo</td>${AMBS.map(x=>`<td>${modo(x)}</td>`).join('')}</tr>
      ${SEVS.map(([k,n,c])=>`<tr><td><span class="sevn"><i class="dotc" style="--c:${c}"></i>${n}</span></td>${AMBS.map(x=>`<td>${cel(x,k,n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="links"><p class="obs">${ic('lock')}<span class="dic" title="Em QA, HML e produção, crítica e alta só não bloqueiam com exceção; em DEV só avisa. A aplicação pode endurecer, nunca afrouxar.">Piso fixo da Esteira</span>: dá para endurecer, nunca afrouxar.</p><a class="link-aud" href="prototipo-excecoes.html">${ic('shield')}2 exceções ativas${ic('chev')}</a>${linkAud('Quem mudou a política','politica')}</div>`;
  if(!ed){barra('');return}
  document.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{P.dev.modo=b.dataset.modo;if(P.dev.modo==='avisa')P.dev.lim={critica:'',alta:'',media:'',baixa:''};abaPolitica()});
  document.querySelectorAll('[data-lim]').forEach(n=>n.oninput=()=>{const [x,k]=n.dataset.lim.split('|');P[x].lim[k]=n.value===''?'':Math.max(0,Math.floor(+n.value));
    const th=document.querySelectorAll('table.pol thead th')[AMBS.indexOf(x)+1],endu=JSON.stringify(P[x])!==JSON.stringify(padrao(x));th.querySelector('small').className=endu?'endu':'';th.querySelector('small').textContent=endu?'endurecida':'padrão';
    barraSalvar('pol','Salvar política')});
  barraSalvar('pol','Salvar política');
}

/* aba Pessoas e papéis: matriz pessoa × papel */
function abaPapeis(){
  const ed=pode.pap();
  $('#aba').innerHTML=(ed?'':soLeitura('MOR'))+`
    <div class="mor-g"><span class="av sm">DB</span><span>Daniel é <b style="color:var(--tx2)">MOR</b>: pode tudo, sem papel aqui.</span></div>
    <div class="box tw"><table class="pap"><thead><tr><th>Pessoa</th>${PAPEIS.map(([k,n,d])=>`<th class="c"><span class="dic" title="${d}">${n}</span></th>`).join('')}${ed?'<th></th>':''}</tr></thead><tbody>${dados.papeis.map((pe,i)=>`<tr class="${salvo.papeis.some(s=>s.u===pe.u)?'':'nova'}">
      <td><div class="pessoa"><span class="av sm">${ini(pe.n)}</span><div>${pe.n}<small class="mono">${pe.u}</small></div></div>${!pe.p.length?'<div class="erro-tx">marque ao menos um papel</div>':''}</td>
      ${PAPEIS.map(([k,n])=>`<td class="c">${ed?`<input type="checkbox" data-pp="${i}|${k}" ${pe.p.includes(k)?'checked':''} aria-label="${pe.n}: ${n}">`:pe.p.includes(k)?`<span class="stat ok" aria-label="sim">${ic('check')}</span>`:'<span style="color:var(--ln2)" aria-label="não">—</span>'}</td>`).join('')}
      ${ed?`<td class="dir"><button class="icone" data-tirar="${i}" title="Tirar ${pe.n} da aplicação">${ic('x')}</button></td>`:''}</tr>`).join('')}</tbody></table></div>
    <div class="links" style="margin-top:4px">${linkAud('Quem deu ou tirou papel','papeis')}</div>`;
  if(!ed){barra('');return}
  document.querySelectorAll('[data-pp]').forEach(c=>c.onchange=()=>{const [i,k]=c.dataset.pp.split('|'),pe=dados.papeis[+i];pe.p=c.checked?[...pe.p,k]:pe.p.filter(x=>x!==k);abaPapeis()});
  document.querySelectorAll('[data-tirar]').forEach(b=>b.onclick=()=>{dados.papeis.splice(+b.dataset.tirar,1);abaPapeis()});
  barraSalvar('papeis','Salvar papéis',dados.papeis.some(p=>!p.p.length)?'Toda pessoa precisa de ao menos um papel':'',`<button class="btn g" data-add-pes>${ic('plus')}Adicionar pessoa</button>`);
  $('[data-add-pes]').onclick=addPessoa;
}
const KEYCLOAK=[['Helena Costa','helena.costa'],['Igor Martins','igor.martins'],['Joana Reis','joana.reis'],['Bruno Lima','bruno.lima'],['Ana Souza','ana.souza']];
function addPessoa(){
  gaveta(topoG('<span class="pill blue">MOR</span>','Adicionar pessoa')+`
    <label class="campo" style="margin-bottom:10px">${ic('search')}<input data-qp placeholder="Buscar no Keycloak" aria-label="Buscar pessoa"></label>
    <div class="box"><div data-rp></div></div>
    <p class="obs">${ic('users')}Entra como Membro; ajuste na tabela antes de salvar.</p>
    <div class="acoes dir"><button class="btn g" data-fechar>Fechar</button></div>`,(g,fechar)=>{
    const q=g.querySelector('[data-qp]'),r=g.querySelector('[data-rp]');
    const des=()=>{const f=q.value.toLowerCase();r.innerHTML=KEYCLOAK.filter(p=>(p[0]+p[1]).toLowerCase().includes(f)).map(([n,u])=>{const ja=dados.papeis.some(p=>p.u===u);
      return `<button class="res${ja?' ja':''}" data-u="${u}" ${ja?'disabled':''}><span class="av sm">${ini(n)}</span>${n}<span class="mono" style="color:var(--di)">${u}</span><span class="dir">${ja?'já tem papel':ic('plus')+'Adicionar'}</span></button>`}).join('')||'<div class="empty" style="border:0">Ninguém encontrado</div>';
      r.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const p=KEYCLOAK.find(k=>k[1]===b.dataset.u);dados.papeis.push({n:p[0],u:p[1],p:['membro']});fechar();detalhe()})};
    q.oninput=des;des();
  });
}

/* editar aplicação (só MOR) */
$('[data-editar]').onclick=()=>{const a=atual;gaveta(topoG('<span class="pill blue">MOR</span>','Editar aplicação')+`
  <label class="fld"><span>Nome</span><input class="inp" data-n value="${a.nome}"></label>
  <div class="lado"><label class="fld"><span>Sigla</span><input class="inp mono" data-s value="${a.sigla}" style="text-transform:uppercase"></label>
    <label class="fld"><span>Ativa</span><span style="height:38px;display:flex;align-items:center"><input type="checkbox" class="tg" data-at ${a.ativa?'checked':''} aria-label="Aplicação ativa" title="Inativa não aceita entrega nova; as abertas seguem até o fim"></span></label></div>
  <label class="fld"><span>Grupo do GitLab</span><input class="inp mono" value="${a.grupo}" readonly title="O grupo não muda depois de criada"></label>
  ${rodapeG(true,'Salvar')}`,(g,fechar)=>{
  g.querySelector('[data-salvar]').onclick=()=>{a.nome=g.querySelector('[data-n]').value.trim()||a.nome;a.sigla=g.querySelector('[data-s]').value.trim().toUpperCase()||a.sigla;a.ativa=g.querySelector('[data-at]').checked;fechar();location.hash='app='+a.sigla;rota()}})};

const sino=$('.sino'),avisos=$('#avisos');
const mostrar=x=>{avisos.hidden=!x;sino.setAttribute('aria-expanded',x)};
sino.onclick=e=>{e.stopPropagation();mostrar(avisos.hidden)};
document.addEventListener('click',e=>{if(!avisos.hidden&&!avisos.contains(e.target))mostrar(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')mostrar(false)});

addEventListener('hashchange',()=>{aba='projetos';rota()});
rota();
</script>
